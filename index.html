  const longDate = (s) => { const { m, d } = D.parts(s); return `${capital(weekday(s))} ${d} de ${Engine.MONTHS[m - 1]}`; };
  const daysTo = (s) => D.diffDays(today, s);
  const whenLabel = (s) => {
    const n = daysTo(s);
    if (n < 0) return `venció hace ${-n} día${n === -1 ? '' : 's'}`;
    if (n === 0) return 'vence hoy';
    if (n === 1) return 'vence mañana';
    return `en ${n} días`;
  };
  const medioName = (t) => (t.cardId ? card(t.cardId)?.name : acc(t.accountId)?.name) || '';

  /* ---------------- Toasts ---------------- */
  function toast(msg, { undo, error } = {}) {
    const el = document.createElement('div');
    el.className = 'toast' + (error ? ' error' : '');
    el.innerHTML = `<span class="grow">${esc(msg)}</span>${undo ? '<button type="button">Deshacer</button>' : ''}`;
    if (undo) el.querySelector('button').onclick = () => { undo(); el.remove(); };
    const box = $('#toasts');
    while (box.children.length >= 2) box.firstElementChild.remove();
    box.appendChild(el);
    setTimeout(() => el.remove(), undo ? 7000 : 3600);
  }

  /* ---------------- Mutaciones (único punto de escritura) ---------------- */
  /**
   * Aplica un cambio, regenera recurrencias, guarda y re-renderiza.
   * Con {undo:true} guarda una instantánea para poder deshacer.
   */
  function commit(fn, msg, { undo = false } = {}) {
    const snap = undo ? JSON.stringify(state) : null;
    fn(state);
    Engine.materializeRecurring(state, today, Store.uid);
    persist();
    render();
    if (msg) toast(msg, snap ? { undo: () => { state = JSON.parse(snap); persist(); render(); toast('Cambio deshecho'); } } : {});
  }
  function persist() {
    const r = Store.save(state);
    if (!r.ok) toast(r.error, { error: true });
  }

  /* ---------------- Navegación ---------------- */
  function renderNav() {
    const link = (r, short) => `<a href="#${r.id}" ${ui.route === r.id ? 'aria-current="page"' : ''}>${icon(r.icon)}<span>${esc(short ? r.short || r.label : r.label)}</span></a>`;
    $('#rail-nav').innerHTML = ROUTES.map((r) => link(r)).join('');
    $('#tab-nav').innerHTML = ROUTES.map((r) => link(r, true)).join('');
    const demo = Store.profile === 'demo' ? `<span class="demo-flag" title="Estás viendo datos ficticios">${icon('flask')}Demo</span>` : '';
    const eye = `<button class="btn btn-ghost btn-icon" data-action="toggle-hide" aria-label="${state?.settings.hideAmounts ? 'Mostrar importes' : 'Ocultar importes'}" aria-pressed="${!!state?.settings.hideAmounts}">${icon(state?.settings.hideAmounts ? 'eye-off' : 'eye')}</button>`;
    $('#top-extra').innerHTML = `<span class="row">${demo}${state ? eye : ''}</span>`;
    $('#rail-foot').innerHTML = state ? `<div class="row between">${demo || '<span class="xs muted">Datos locales</span>'}${eye}</div>` : '';
    document.body.classList.toggle('hide-amounts', !!state?.settings.hideAmounts);
  }
  function go(route) { location.hash = route; }

  function render() {
    today = D.today();
    const main = $('#main');
    renderNav();
    if (!state) { main.innerHTML = viewWelcome(); return; }
    const view = { inicio: viewHome, movimientos: viewMovs, deudas: viewDebts, proyeccion: viewProjection, config: viewConfig }[ui.route] || viewHome;
    main.innerHTML = view();
    afterRender();
  }

  /* ======================= BIENVENIDA ======================= */
  function viewWelcome() {
    const hasReal = Store.has('real'), hasDemo = Store.has('demo');
    const seeded = !hasReal && !!document.getElementById('seed-data');
    return `<section class="welcome">
      <h1>Tu plata, clara en segundos.</h1>
      <p class="lead">Registrá ingresos y gastos, anticipá vencimientos y sabé cuánto te queda —o cuánto te falta— para cubrir el mes. Todo se guarda solo en este navegador.</p>
      <button class="choice" data-action="start-real">${icon('user')}<div><strong>${hasReal ? 'Continuar con mis datos' : 'Empezar con mis datos'}</strong><span>${hasReal ? 'Abrí tus registros guardados en este navegador.' : seeded ? 'Este archivo trae tus datos iniciales: se cargan al entrar.' : 'Arrancás vacío: cargás tus cuentas, ingresos y gastos fijos.'}</span></div></button>
      ${!hasReal && !seeded ? `<button class="choice" data-action="start-import">${icon('upload')}<div><strong>Tengo un respaldo</strong><span>Importá el archivo JSON con tus datos (por ejemplo, desde otra computadora o el celular).</span></div></button>` : ''}
      <button class="choice" data-action="start-demo">${icon('flask')}<div><strong>Explorar con datos de ejemplo</strong><span>${hasDemo ? 'Volvé al perfil de demostración.' : 'Datos ficticios para probar todo.'} Se guardan aparte y nunca se mezclan con los tuyos.</span></div></button>
      <p class="note mt">${icon('shield', 'i')} No cargues contraseñas, números completos de tarjeta ni claves bancarias: la aplicación no los necesita.</p>
    </section>`;
  }

  /* ======================= INICIO ======================= */
  function needsBackup() {
    if (Store.profile !== 'real' || state.txs.length < 1) return null;
    const last = state.settings.lastBackupAt ? new Date(state.settings.lastBackupAt) : null;
    const days = last ? Math.floor((Date.now() - last.getTime()) / 864e5) : -1; // -1: nunca
    return days === -1 || days >= 7 ? days : null;
  }
  function topBanners() {
    let out = '';
    if (Store.profile === 'demo') out += `<div class="banner banner-warn">${icon('flask')}<div class="grow"><b>Modo demostración.</b> Estás viendo datos ficticios. Tus datos reales no se muestran ni se modifican.</div><button class="btn btn-s" data-action="switch-profile" data-p="real">Ir a mis datos</button></div>`;
    const nb = needsBackup();
    if (nb !== null) out += `<div class="banner">${icon('shield')}<div class="grow">${nb >= 0 ? `Tu último respaldo fue hace ${nb} días.` : 'Todavía no hiciste un respaldo.'} Los datos viven solo en este navegador: si se borra la caché, se pierden.</div><button class="btn btn-s" data-action="export-json">${icon('download')}Respaldar</button></div>`;
    return out;
  }

  function viewHome() {
    const st = Engine.monthStatus(state, today);
    const ms = Engine.monthSummary(state, today);
    const debt = Engine.totalDebt(state, today);
    const up = Engine.upcoming(state, today, 5);
    const P = D.period(today);
    const isEmpty = !state.txs.length && !state.recurrings.length && !state.loans.length && !state.cards.length;
    const pos = st.projected >= 0;
    const overdueTotal = st.overdue.reduce((s, i) => s + i.amount, 0);

    const onboarding = isEmpty ? viewOnboarding() : '';
    const hero = `<section class="hero ${pos ? 'is-pos' : 'is-neg'}" aria-labelledby="hero-l">
      <div class="row between wrap">
        <p class="hero-label" id="hero-l">${pos ? 'A fin de mes te quedan' : 'Para cubrir el mes te faltan'}</p>
        <span class="pill ${pos ? 'pill-pos' : 'pill-neg'}">${icon(pos ? 'check' : 'alert')}${pos ? 'Compromisos cubiertos' : 'Déficit del mes'}</span>
      </div>
      <p class="hero-value amt">${esc(fmt(Math.abs(st.projected)))}</p>
      <p class="muted small">Saldo proyectado al ${D.parts(D.periodEnd(P)).d} de ${Engine.MONTHS[D.parts(today).m - 1]} con lo que ya está registrado.</p>
      <div class="equation" role="group" aria-label="Cómo se calcula">
        <div class="eq-term"><span class="lbl"><span class="op" aria-hidden="true">=</span>Disponible hoy</span>${amt(st.available)}</div>
        <div class="eq-op" aria-hidden="true">+</div>
        <div class="eq-term"><span class="lbl"><span class="op" aria-hidden="true">+</span>Por cobrar este mes</span>${amt(st.pendingIn)}</div>
        <div class="eq-op" aria-hidden="true">−</div>
        <div class="eq-term"><span class="lbl"><span class="op" aria-hidden="true">−</span>Por pagar este mes</span>${amt(st.pendingOut)}</div>
        <div class="eq-op" aria-hidden="true">=</div>
        <div class="eq-term total"><span class="lbl"><span class="op" aria-hidden="true">=</span>Saldo a fin de mes</span>${amt(st.projected)}</div>
      </div>
      <div class="hero-notes">
        ${overdueTotal > 0 ? `<div class="callout warn">${st.overdue.length} pago${st.overdue.length > 1 ? 's' : ''} vencido${st.overdue.length > 1 ? 's' : ''} por <b>${esc(fmt(overdueTotal))}</b> ya está${st.overdue.length > 1 ? 'n' : ''} incluido${st.overdue.length > 1 ? 's' : ''} en “por pagar”.</div>` : ''}
        ${!pos ? `<div><p class="small" style="font-weight:600;margin-bottom:4px">Lo que más pesa en el faltante</p><div class="list">${st.outs.slice(0, 4).map(dueItem).join('')}</div></div>` : ''}
        ${st.variableEst > 0 ? `<p class="note">Si además gastás el día a día estimado que resta del mes (${esc(fmt(st.variableEst))}), terminarías en <b class="amt ${st.withVariable < 0 ? 'neg' : ''}">${esc(fmt(st.withVariable))}</b>.</p>` : ''}
      </div>
    </section>`;

    const accRows = state.accounts.filter((a) => !a.archived).map((a) => `<div class="kv"><span class="k">${icon(accIcon(a))}<span>${esc(a.name)}</span></span><span class="v">${amt(Engine.accountBalance(a, state.txs), { tone: true })}</span></div>`).join('');
    const futureCommit = debt.cards.reduce((s, c) => s + c.periods.filter((p) => p.dueDate > D.periodEnd(P)).reduce((a, p) => a + p.outstanding, 0), 0)
      + debt.loans.reduce((s, l) => s + l.schedule.filter((x) => x.date > D.periodEnd(P)).reduce((a, x) => a + x.amount, 0), 0);

    const kpis = `<div class="grid grid-4 mt">
      <section class="card kpi"><h2 class="kpi-label">${icon('wallet')}Saldo disponible real</h2><p class="kpi-value">${amt(st.available, { tone: st.available < 0 })}</p>${accRows || '<p class="note">Sin cuentas.</p>'}<p class="note">Efectivo y cuentas, solo con movimientos ya pagados o cobrados.</p></section>
      <section class="card kpi"><h2 class="kpi-label">${icon('in')}Ingresos del mes</h2><p class="kpi-value">${amt(ms.incomeReceived + ms.incomePending)}</p>
        <div class="kv"><span class="k">Cobrados</span><span class="v">${amt(ms.incomeReceived)}</span></div>
        <div class="kv"><span class="k">Por cobrar</span><span class="v">${amt(ms.incomePending)}</span></div></section>
      <section class="card kpi"><h2 class="kpi-label">${icon('out')}Gastos del mes</h2><p class="kpi-value">${amt(ms.consumption)}</p>
        <div class="kv"><span class="k">Pagados</span><span class="v">${amt(ms.paidExp)}</span></div>
        <div class="kv"><span class="k">Pendientes</span><span class="v">${amt(ms.pendingExp)}</span></div>
        <div class="kv"><span class="k">Con tarjeta</span><span class="v">${amt(ms.cardExp)}</span></div>
        ${ms.loanInterest ? `<div class="kv"><span class="k">Intereses de préstamos</span><span class="v">${amt(ms.loanInterest)}</span></div>` : ''}
        <div class="kv"><span class="k">Compromisos futuros</span><span class="v">${amt(futureCommit)}</span></div>
        <p class="note">Las compras con tarjeta cuentan como gasto cuando las hacés; la plata sale cuando pagás el resumen. Compromisos futuros: cuotas de tarjetas y préstamos de los próximos meses.</p></section>
      <section class="card kpi"><h2 class="kpi-label">${icon('loan')}Deuda total</h2><p class="kpi-value">${amt(debt.total)}</p>
        <div class="kv"><span class="k">Tarjetas</span><span class="v">${amt(debt.cardDebt)}</span></div>
        <div class="kv"><span class="k">Préstamos y deudas</span><span class="v">${amt(debt.loanDebt)}</span></div>
        ${debt.unknownLoans ? `<div class="kv"><span class="k warn">${debt.unknownLoans} préstamo${debt.unknownLoans > 1 ? 's' : ''} sin saldo informado</span><span class="v"><a href="#deudas" data-action="debt-tab" data-tab="prestamos">Completar</a></span></div>` : ''}
        <p class="note">Lo que todavía debés en total. No es un gasto del mes: se paga en cuotas y resúmenes.</p></section>
    </div>`;

    const upcomingCard = `<section class="card"><div class="card-head"><h2>${icon('calendar')}Próximos vencimientos</h2><a class="btn btn-ghost btn-s" href="#proyeccion">Ver proyección</a></div>
      ${up.length ? `<div class="list">${up.map(dueItem).join('')}</div>` : emptyBox('calendar', 'Sin vencimientos', 'Cuando cargues gastos fijos, cuotas o tarjetas, vas a ver acá lo próximo a pagar.')}</section>`;

    const catCard = `<section class="card"><div class="card-head"><h2>${icon('chart')}Gastos por categoría</h2><span class="small muted">${capital(Engine.periodLabel(P))}</span></div>${categoryBars(ms)}</section>`;
    return `${topBanners()}
      <div class="page-head"><div><h1>${capital(Engine.periodLabel(P))}</h1><p class="sub">${longDate(today)}</p></div>
      <button class="btn btn-primary" data-action="new-tx">${icon('plus')}Agregar movimiento</button></div>
      ${onboarding}${hero}${kpis}<div class="grid grid-2 mt">${upcomingCard}${catCard}</div>`;
  }

  function viewOnboarding() {
    const hasAcc = state.accounts.some((a) => a.openingBalance !== 0 || state.accounts.length > 1);
    const steps = [
      [hasAcc, 'Cargá tus cuentas y su saldo actual', 'Efectivo, banco, billeteras virtuales.', 'add-account'],
      [state.recurrings.length > 0, 'Agregá ingresos y gastos fijos', 'Sueldo, alquiler, expensas, servicios, suscripciones.', 'new-rec'],
      [state.cards.length > 0, 'Sumá tus tarjetas de crédito', 'Con fecha de cierre y vencimiento.', 'new-card'],
      [state.loans.length > 0, 'Registrá préstamos y deudas', 'Banco, empresa, familia o amigos.', 'new-loan'],
    ];
    return `<section class="card mb"><div class="card-head"><h2>Primeros pasos</h2><span class="small muted">Podés hacerlo en cualquier orden</span></div>
      <div class="list steps">${steps.map(([done, t, d, a], i) => `<button class="item ${done ? 'done' : ''}" data-action="${a}"><span class="ico">${done ? icon('check') : i + 1}</span><span class="main"><span class="title">${t}</span><span class="meta">${d}</span></span>${icon('right')}</button>`).join('')}</div></section>`;
  }

  /** Fila de vencimiento con acción de pago. */
  function dueItem(i) {
    const ref = i.ref;
    const kindIcon = ref.type === 'card' ? 'card' : ref.type === 'loan' ? 'loan' : ref.type === 'rec' || (ref.type === 'tx' && i.group === 'fijos') ? 'repeat' : 'out';
    const action = ref.type === 'tx' ? `data-action="pay-tx" data-id="${ref.id}"` : ref.type === 'card' ? `data-action="pay-card" data-id="${ref.id}"` : ref.type === 'loan' ? `data-action="pay-loan" data-id="${ref.id}"` : `data-action="edit-rec" data-id="${ref.id}"`;
    const actLabel = ref.type === 'rec' ? 'Ver' : 'Pagar';
    return `<div class="item" style="cursor:default"><span class="ico ${i.overdue ? 'alert' : ''}">${icon(i.overdue ? 'alert' : kindIcon)}</span>
      <span class="main"><span class="title">${esc(i.label)}</span><span class="meta"><span>${dl(i.date)}</span><span class="${i.overdue ? 'neg' : ''}">${whenLabel(i.date)}</span>${!i.confirmed ? '<span>importe estimado</span>' : ''}</span></span>
      <span class="end">${amt(i.amount)}<button class="btn btn-s" ${action} aria-label="${actLabel}: ${esc(i.label)}">${actLabel}</button></span></div>`;
  }

  function categoryBars(ms) {
    const entries = [...ms.byCat.entries()].filter(([, v]) => v > 0).sort((a, b) => b[1] - a[1]);
    if (!entries.length) return emptyBox('chart', 'Sin gastos este mes', 'Registrá un gasto y vas a ver cómo se distribuye.');
    const top = entries.slice(0, 6);
    const rest = entries.slice(6).reduce((s, [, v]) => s + v, 0);
    if (rest > 0) top.push(['__otras', rest]);
    const max = top[0][1];
    const total = ms.consumption;
    const bars = top.map(([id, v]) => {
      const name = id === '__otras' ? 'Otras categorías' : cat(id)?.name || 'Sin categoría';
      return `<div class="bar-row"><div class="bar-top"><span class="name">${esc(name)}</span><span class="small"><span class="amt">${esc(fmt(v))}</span> <span class="muted">${Math.round(v / total * 100)}%</span></span></div><div class="bar-track" aria-hidden="true"><div class="bar-fill" style="width:${(v / max * 100).toFixed(1)}%"></div></div></div>`;
    }).join('');
    const cls = [['esencial', 'Esenciales', 'var(--s1)'], ['ajustable', 'Ajustables', 'var(--s2)'], ['discrecional', 'Discrecionales', 'var(--s3)']];
    const stacked = `<div class="stacked" aria-hidden="true">${cls.map(([k, , c]) => ms.byClass[k] > 0 ? `<span style="flex:${ms.byClass[k]};background:${c}"></span>` : '').join('')}</div>
      <div class="legend">${cls.map(([k, l, c]) => `<span><i style="background:${c}"></i>${l} <b class="amt">${esc(fmt(ms.byClass[k] || 0))}</b></span>`).join('')}</div>`;
    return `<div class="bars">${bars}</div><div class="mt"><p class="small" style="font-weight:600">Por tipo de gasto</p>${stacked}</div>`;
  }

  const emptyBox = (ic, t, d, btn = '') => `<div class="empty">${icon(ic)}<h3>${esc(t)}</h3><p>${esc(d)}</p>${btn}</div>`;

  /* ======================= MOVIMIENTOS ======================= */
  function viewMovs() {
    const tabs = `<div class="seg" role="tablist" aria-label="Vista de movimientos">
      <button role="tab" aria-selected="${ui.movTab === 'lista'}" data-action="mov-tab" data-tab="lista">Movimientos</button>
      <button role="tab" aria-selected="${ui.movTab === 'rec'}" data-action="mov-tab" data-tab="rec">Recurrentes</button></div>`;
    return `${Store.profile === 'demo' ? topBanners() : ''}<div class="page-head"><div><h1>Movimientos</h1><p class="sub">Ingresos, gastos y transferencias</p></div>${tabs}</div>
      ${ui.movTab === 'lista' ? viewMovList() : viewRecurring()}`;
  }

  function filteredTxs() {
    const f = ui.filters; const q = f.q.trim().toLowerCase();
    return state.txs.filter((t) => {
      if (D.period(t.date) !== f.period) return false;
      if (f.kind && (f.kind === 'deuda' ? !['pago_tarjeta', 'pago_prestamo', 'prestamo_recibido'].includes(t.kind) : t.kind !== f.kind)) return false;
      if (f.cat && t.categoryId !== f.cat) return false;
      if (f.medio && t.accountId !== f.medio && t.cardId !== f.medio && t.toAccountId !== f.medio) return false;
      if (f.status && (f.status === 'pendiente') !== (t.status === 'pendiente')) return false;
      if (q) {
        const hay = [t.description, cat(t.categoryId)?.name, medioName(t), loan(t.loanId)?.creditor].join(' ').toLowerCase();
        if (!hay.includes(q)) return false;
      }
      return true;
    }).sort((a, b) => b.date.localeCompare(a.date) || (b.createdAt || 0) - (a.createdAt || 0));
  }

  function viewMovList() {
    const f = ui.filters;
    const list = filteredTxs();
    const income = list.filter((t) => t.kind === 'ingreso').reduce((s, t) => s + t.amount, 0);
    const expense = list.reduce((s, t) => s + Engine.economicExpense(t), 0);
    const catOpts = Store.GROUPS.map((g) => `<optgroup label="${esc(g.name)}">${state.categories.filter((c) => c.group === g.id).map((c) => `<option value="${c.id}" ${f.cat === c.id ? 'selected' : ''}>${esc(c.name)}</option>`).join('')}</optgroup>`).join('');
    const medios = [...state.accounts.map((a) => [a.id, a.name]), ...state.cards.map((c) => [c.id, c.name])];
    const groups = new Map();
    for (const t of list) { if (!groups.has(t.date)) groups.set(t.date, []); groups.get(t.date).push(t); }
    const body = list.length ? [...groups.entries()].map(([d, ts]) => `<div class="day-head"><span>${longDate(d)}</span></div>${ts.map(txRow).join('')}`).join('')
      : emptyBox('list', `Sin movimientos en ${Engine.periodLabel(f.period)}`, f.q || f.kind || f.cat || f.medio || f.status ? 'Probá quitando algún filtro.' : 'Registrá tu primer ingreso o gasto del mes.', `<button class="btn btn-primary" data-action="new-tx">${icon('plus')}Agregar movimiento</button>`);
    return `<div class="row between wrap mb">
        <div class="month-nav"><button class="btn btn-ghost btn-icon" data-action="mov-month" data-d="-1" aria-label="Mes anterior">${icon('left')}</button><strong aria-live="polite">${Engine.periodLabel(f.period)}</strong><button class="btn btn-ghost btn-icon" data-action="mov-month" data-d="1" aria-label="Mes siguiente">${icon('right')}</button></div>
        <div class="row"><button class="btn btn-s" data-action="export-csv">${icon('download')}Exportar CSV</button></div></div>
      <div class="filters" role="search">
        <input class="input search" type="search" placeholder="Buscar por descripción, categoría o medio" value="${esc(f.q)}" data-filter="q" aria-label="Buscar">
        <select class="input" data-filter="kind" aria-label="Tipo"><option value="">Todos los tipos</option>${[['ingreso', 'Ingresos'], ['gasto', 'Gastos'], ['transferencia', 'Transferencias'], ['deuda', 'Pagos de deudas']].map(([v, l]) => `<option value="${v}" ${f.kind === v ? 'selected' : ''}>${l}</option>`).join('')}</select>
        <select class="input" data-filter="cat" aria-label="Categoría"><option value="">Todas las categorías</option>${catOpts}</select>
        <select class="input" data-filter="medio" aria-label="Medio de pago"><option value="">Todos los medios</option>${medios.map(([v, l]) => `<option value="${v}" ${f.medio === v ? 'selected' : ''}>${esc(l)}</option>`).join('')}</select>
        <select class="input" data-filter="status" aria-label="Estado"><option value="">Pagados y pendientes</option><option value="pendiente" ${f.status === 'pendiente' ? 'selected' : ''}>Solo pendientes</option><option value="pagado" ${f.status === 'pagado' ? 'selected' : ''}>Solo pagados</option></select>
      </div>
      <div class="totals"><span class="chip">Ingresos<b class="amt pos">${esc(fmt(income))}</b></span><span class="chip">Gastos<b class="amt">${esc(fmt(expense))}</b></span><span class="chip">${list.length} movimiento${list.length === 1 ? '' : 's'}</span></div>
      <section class="card" style="padding:8px 14px">${body}</section>`;
  }

  function txRow(t) {
    const c = cat(t.categoryId);
    let ic = 'out', icCls = '', title = t.description || c?.name || Store.KIND_LABEL[t.kind], sign = -1;
    const meta = [];
    if (t.kind === 'ingreso') { ic = 'in'; icCls = 'in'; sign = 1; }
    if (t.kind === 'prestamo_recibido') { ic = 'loan'; sign = 1; }
    if (t.kind === 'transferencia') { ic = 'transfer'; sign = 0; meta.push(`${acc(t.accountId)?.name || '?'} a ${acc(t.toAccountId)?.name || '?'}`); }
    if (t.kind === 'pago_tarjeta') { ic = 'card'; meta.push(`Pago a ${card(t.cardId)?.name || 'tarjeta'}`); }
    if (t.kind === 'pago_prestamo') { ic = 'loan'; meta.push(`${loan(t.loanId)?.creditor || 'Préstamo'}${t.interest ? ` · interés ${fmt(t.interest)}` : ''}`); }
    if (c && t.kind !== 'pago_prestamo') meta.push(c.name);
    if (t.kind === 'gasto' || t.kind === 'ingreso' || t.kind === 'pago_tarjeta' || t.kind === 'pago_prestamo') { const m = t.kind === 'pago_tarjeta' ? acc(t.accountId)?.name : medioName(t); if (m) meta.push(m); }
    if (t.cardId && t.kind === 'gasto') ic = 'card';
    if (t.recId) meta.push('Recurrente');
    const pills = [];
    if (t.status === 'pendiente') pills.push(`<span class="pill ${t.date < today ? 'pill-neg' : 'pill-warn'}">${t.date < today ? 'Vencido' : 'Pendiente'}</span>`);
    if (t.cardId && t.installments > 1) pills.push(`<span class="pill pill-accent">${t.installments} cuotas</span>`);
    const a = sign === 0 ? `<span class="amt">${esc(fmt(t.amount))}</span>` : `<span class="amt ${sign > 0 ? 'pos' : ''}">${esc(fmt(sign * t.amount, { sign: sign > 0 }))}</span>`;
    return `<button class="item" data-action="edit-tx" data-id="${t.id}"><span class="ico ${icCls}">${icon(ic)}</span>
      <span class="main"><span class="title">${esc(title)}</span><span class="meta">${meta.map((m) => `<span>${esc(m)}</span>`).join('')}</span></span>
      <span class="end">${a}${pills.join('')}</span></button>`;
  }

  /* ---------- Recurrentes ---------- */
  function viewRecurring() {
    const block = (type, title) => {
      const items = state.recurrings.filter((r) => r.type === type);
      if (!items.length) return '';
      return `<div class="group-title"><span>${title}</span><span class="amt small muted">${esc(fmt(items.filter((r) => r.active).reduce((s, r) => s + monthlyEq(r), 0)))} por mes</span></div><div class="list">${items.map((r) => {
        const nx = Engine.recNext(r, state, today);
        const medio = r.cardId ? card(r.cardId)?.name : acc(r.accountId)?.name;
        return `<button class="item" data-action="edit-rec" data-id="${r.id}"><span class="ico ${type === 'ingreso' ? 'in' : ''}">${icon('repeat')}</span>
          <span class="main"><span class="title">${esc(r.name)}</span><span class="meta"><span>${Engine.FREQ[r.frequency]?.label}, día ${r.dueDay}</span>${medio ? `<span>${esc(medio)}</span>` : ''}${nx ? `<span>Próximo: ${dl(nx.date)}</span>` : ''}</span></span>
          <span class="end">${amt(Engine.recAmountFor(r, D.period(today)))}${!r.active ? '<span class="pill">Pausado</span>' : r.estimated ? '<span class="pill">Estimado</span>' : ''}</span></button>`;
      }).join('')}</div>`;
    };
    const content = state.recurrings.length ? block('ingreso', 'Ingresos recurrentes') + block('gasto', 'Gastos fijos y suscripciones')
      : emptyBox('repeat', 'Sin recurrentes', 'Cargá sueldo, alquiler, expensas, servicios o suscripciones una sola vez: se generan solos cada mes como pendientes.');
    return `<div class="row between mb"><p class="small muted" style="max-width:560px">Cada mes se crea automáticamente el movimiento pendiente. Cambiar un importe aplica desde el mes que elijas y no modifica pagos anteriores.</p><button class="btn btn-primary" data-action="new-rec">${icon('plus')}Nuevo recurrente</button></div>
      <section class="card">${content}</section>`;
  }
  const monthlyEq = (r) => Math.round(Engine.recAmountFor(r, D.period(today)) / ((Engine.FREQ[r.frequency] || {}).months || 1));

  /* ======================= DEUDAS Y TARJETAS ======================= */
  function viewDebts() {
    const debt = Engine.totalDebt(state, today);
    const tabs = `<div class="seg" role="tablist" aria-label="Tipo de deuda">
      <button role="tab" aria-selected="${ui.debtTab === 'tarjetas'}" data-action="debt-tab" data-tab="tarjetas">Tarjetas</button>
      <button role="tab" aria-selected="${ui.debtTab === 'prestamos'}" data-action="debt-tab" data-tab="prestamos">Préstamos y deudas</button></div>`;
    const P = D.period(today);
    const thisMonth = debt.cards.reduce((s, c) => s + c.periods.filter((p) => p.outstanding > 0 && p.dueDate <= D.periodEnd(P) && p.closingDate < today).reduce((a, p) => a + p.outstanding, 0), 0)
      + debt.loans.reduce((s, l) => s + l.schedule.filter((x) => x.date <= D.periodEnd(P)).reduce((a, x) => a + x.amount, 0), 0);
    const summary = `<div class="grid grid-4 mb">
      <div class="box"><p class="lbl">Deuda total</p><p class="val">${esc(fmt(debt.total))}</p></div>
      <div class="box"><p class="lbl">Tarjetas</p><p class="val">${esc(fmt(debt.cardDebt))}</p></div>
      <div class="box"><p class="lbl">Préstamos y deudas</p><p class="val">${esc(fmt(debt.loanDebt))}</p>${debt.unknownLoans ? `<p class="sub warn">${debt.unknownLoans} sin saldo informado</p>` : ''}</div>
      <div class="box"><p class="lbl">A pagar este mes</p><p class="val ${thisMonth ? 'warn' : ''}">${esc(fmt(thisMonth))}</p><p class="sub">Resúmenes cerrados y cuotas</p></div></div>`;
    return `${Store.profile === 'demo' ? topBanners() : ''}<div class="page-head"><div><h1>Deudas y tarjetas</h1><p class="sub">Lo que debés, a quién y cuándo vence</p></div>${tabs}</div>
      ${summary}${ui.debtTab === 'tarjetas' ? viewCards(debt.cards) : viewLoans(debt.loans)}`;
  }

  const STATUS_LBL = { pagado: ['Pagado', 'pill-pos'], vencido: ['Vencido', 'pill-neg'], parcial: ['Pago parcial', 'pill-warn'], a_pagar: ['A pagar', 'pill-warn'], abierto: ['Abierto', 'pill-accent'], futuro: ['Cuotas futuras', ''], sin_consumos: ['Sin consumos', ''] };
  const statusPill = (s) => { const [l, c] = STATUS_LBL[s] || [s, '']; return `<span class="pill ${c}">${l}</span>`; };

  function viewCards(list) {
    const head = `<div class="row between mb"><p class="small muted" style="max-width:600px">Una compra con tarjeta cuenta como gasto el día que la hacés, pero la plata sale de tu cuenta cuando pagás el resumen. Así no se cuenta dos veces.</p><button class="btn btn-primary" data-action="new-card">${icon('plus')}Nueva tarjeta</button></div>`;
    if (!list.length) return head + `<section class="card">${emptyBox('card', 'Sin tarjetas', 'Agregá tus tarjetas con su fecha de cierre y vencimiento para ver resúmenes y cuotas futuras.', `<button class="btn btn-primary" data-action="new-card">${icon('plus')}Agregar tarjeta</button>`)}</section>`;
    return head + `<div class="grid grid-2">${list.map(cardTile).join('')}</div>`;
  }

  function cardTile(cs) {
    const c = cs.card;
    const due = cs.nextToPay;
    const open = cs.open;
    const nClosed = cs.periods.filter((p) => p.closingDate < today && p.outstanding > 0).length;
    const purchases = state.txs.filter((t) => t.kind === 'gasto' && t.cardId === c.id && t.installments > 1);
    const activeInst = purchases.map((t) => {
      const inst = Engine.cardInstallments(c, t);
      const remaining = inst.filter((i) => i.period > (cs.nextToPay?.period || (open ? D.addPeriod(open.period, -1) : D.period(today)))).length;
      return { t, inst, remaining };
    }).filter((x) => x.remaining > 0);
    const periodsRows = cs.periods.filter((p) => p.amount > 0 && (p.status !== 'pagado' || p.period >= D.addPeriod(D.period(today), -3))).map((p) => `<tr><td>${capital(Engine.periodLabel(p.period))}</td><td>${dl(p.closingDate)}</td><td>${dl(p.dueDate)}${p.estimated ? '<span class="muted">*</span>' : ''}</td><td class="r amt">${esc(fmt(p.amount))}</td><td class="r amt">${esc(fmt(p.paid))}</td><td class="r amt">${esc(fmt(p.outstanding))}</td><td>${statusPill(p.status)}</td></tr>`).join('');
    return `<section class="card debt-card" aria-labelledby="card-${c.id}">
      <div class="debt-top"><div><h2 class="t" id="card-${c.id}">${esc(c.name)}</h2><p class="small muted">Cierra el ${c.closingDay}, vence el ${c.dueDay}${c.limit ? ` · Límite ${esc(fmt(c.limit))}` : ''}</p></div>
        <button class="btn btn-ghost btn-icon" data-action="edit-card" data-id="${c.id}" aria-label="Editar ${esc(c.name)}">${icon('edit')}</button></div>
      <div class="split">
        <div class="box"><p class="lbl">${nClosed > 1 ? `A pagar · ${nClosed} resúmenes cerrados` : due ? `A pagar · resumen ${Engine.periodLabel(due.period, true)}` : 'A pagar'}</p><p class="val ${due?.status === 'vencido' ? 'neg' : ''}">${esc(fmt(cs.dueNow))}</p><p class="sub">${due ? `${nClosed > 1 ? 'El más antiguo vence' : 'Vence'} ${dl(due.dueDate)}${due.estimated ? ' (estimado)' : ''} ${statusPill(due.status)}` : 'Nada pendiente'}</p></div>
        <div class="box"><p class="lbl">${open ? `Resumen abierto · ${Engine.periodLabel(open.period, true)}` : 'Resumen abierto'}</p><p class="val">${esc(fmt(open ? open.outstanding : 0))}</p><p class="sub">${open ? `Cierra ${dl(open.closingDate)}, vence ${dl(open.dueDate)}` : 'Sin consumos'}</p></div>
      </div>
      <div class="kv"><span class="k">Deuda total de la tarjeta</span><span class="v">${amt(Math.max(0, cs.debt))}</span></div>
      ${cs.credit > 0 ? `<div class="kv"><span class="k">Saldo a favor</span><span class="v pos">${amt(cs.credit)}</span></div>` : ''}
      ${c.limit ? `<div class="kv"><span class="k">Disponible para compras</span><span class="v">${amt(c.limit - Math.max(0, cs.debt))}</span></div>` : ''}
      <div class="actions"><button class="btn btn-s btn-accent" data-action="pay-card" data-id="${c.id}">Pagar resumen</button><button class="btn btn-s" data-action="new-tx" data-card="${c.id}">${icon('plus')}Compra</button><button class="btn btn-s" data-action="statement" data-id="${c.id}">Registrar resumen</button></div>
      <details class="more"><summary>${icon('right')}Resúmenes y cuotas</summary><div>
        ${periodsRows ? `<div class="table-wrap"><table><thead><tr><th>Resumen</th><th>Cierre</th><th>Vence</th><th class="r">Total</th><th class="r">Pagado</th><th class="r">Saldo</th><th>Estado</th></tr></thead><tbody>${periodsRows}</tbody></table></div><p class="note">* Fecha estimada con la configuración de la tarjeta. Registrá el resumen para usar las fechas reales.</p>` : '<p class="note">Todavía no hay consumos.</p>'}
        ${activeInst.length ? `<p class="small mt" style="font-weight:650">Compras en cuotas</p><div class="list">${activeInst.map(({ t, inst, remaining }) => `<button class="item" data-action="edit-tx" data-id="${t.id}"><span class="ico">${icon('card')}</span><span class="main"><span class="title">${esc(t.description || cat(t.categoryId)?.name)}</span><span class="meta"><span>${dl(t.date, { year: true })}</span><span>${t.installments} cuotas de ${esc(fmt(inst[inst.length - 1].amount))}</span><span>Restan ${remaining}</span></span></span><span class="end">${amt(t.amount)}</span></button>`).join('')}</div>` : ''}
      </div></details>
    </section>`;
  }

  function viewLoans(list) {
    const head = `<div class="row between mb"><p class="small muted" style="max-width:600px">Cada pago se registra una sola vez: baja tu saldo disponible y reduce la deuda. Si incluye intereses, solo el capital reduce lo que debés.</p><button class="btn btn-primary" data-action="new-loan">${icon('plus')}Nuevo préstamo o deuda</button></div>`;
    if (!list.length) return head + `<section class="card">${emptyBox('loan', 'Sin préstamos ni deudas', 'Registrá lo que debés y a quién: bancos, la empresa, familia o amigos. Admite cuotas fijas o pagos libres.', `<button class="btn btn-primary" data-action="new-loan">${icon('plus')}Registrar deuda</button>`)}</section>`;
    const TYPE = { banco: 'Banco', empresa: 'Empresa', familiar: 'Familiar', amigo: 'Amigo', otro: 'Otro' };
    return head + `<div class="grid grid-2">${list.map((ls) => {
      const l = ls.loan;
      const pct = ls.progress != null ? Math.round(ls.progress * 100) : null;
      const nx = ls.next;
      const rows = ls.payments.slice().reverse().map((p) => `<tr class="clickable" data-action="edit-tx" data-id="${p.id}"><td>${dl(p.date, { year: true })}</td><td>${{ cuota: 'Cuota', parcial: 'Parcial', extraordinario: 'Extraordinario', cancelacion: 'Cancelación' }[p.paymentType] || 'Pago'}</td><td class="r amt">${esc(fmt(p.amount))}</td><td class="r amt">${esc(fmt(p.interest || 0))}</td><td class="r amt">${esc(fmt(p.amount - (p.interest || 0)))}</td></tr>`).join('');
      return `<section class="card debt-card">
        <div class="debt-top"><div><h2 class="t">${esc(l.creditor)}</h2><p class="small muted">${TYPE[l.creditorType] || ''}${l.rate ? ` · TNA ${String(l.rate).replace('.', ',')}%` : ''}${l.installments ? ` · ${l.installments} cuotas` : ''}</p></div>
          <div class="row">${ls.closed ? '<span class="pill pill-pos">Cancelado</span>' : ls.overdue.length ? '<span class="pill pill-neg">Cuota vencida</span>' : ''}<button class="btn btn-ghost btn-icon" data-action="edit-loan" data-id="${l.id}" aria-label="Editar ${esc(l.creditor)}">${icon('edit')}</button></div></div>
        ${pct != null ? `<div><div class="row between small"><span class="muted">Capital cancelado</span><span class="amt">${pct}%</span></div><div class="progress mt-s" role="progressbar" aria-valuenow="${pct}" aria-valuemin="0" aria-valuemax="100" aria-label="Capital cancelado"><span style="width:${pct}%"></span></div></div>` : ''}
        <div class="split">
          ${ls.balanceKnown ? `<div class="box"><p class="lbl">Saldo pendiente</p><p class="val">${esc(fmt(Math.max(0, ls.balance)))}</p><p class="sub">de ${esc(fmt(l.originalAmount || l.initialBalance))} original</p></div>` : `<div class="box"><p class="lbl">Saldo pendiente</p><p class="val warn">Sin informar</p><p class="sub"><button class="btn btn-ghost btn-s" style="padding:0;height:auto" data-action="edit-loan" data-id="${l.id}">Completar saldo y cuotas</button></p></div>`}
          <div class="box"><p class="lbl">Próximo vencimiento</p><p class="val ${nx && nx.date < today ? 'neg' : ''}">${nx ? esc(fmt(nx.amount)) : '—'}</p><p class="sub">${nx ? `${dl(nx.date)}, ${whenLabel(nx.date)}` : ls.closed ? 'Sin pagos pendientes' : 'Sin vencimiento definido'}</p></div>
        </div>
        ${l.installments ? `<div class="kv"><span class="k">Cuotas abonadas</span><span class="v">${ls.cuotasPaid} de ${l.installments}</span></div><div class="kv"><span class="k">Cuotas restantes</span><span class="v">${ls.remainingCount}</span></div>` : ''}
        <div class="kv"><span class="k">Cancelación estimada</span><span class="v">${ls.closed ? 'Cancelado' : ls.estCancel ? `${capital(Engine.periodLabel(D.period(ls.estCancel)))}${ls.scheduleEstimated ? ' (aprox.)' : ''}` : 'Sin datos suficientes'}</span></div>
        ${l.installmentAmount && !l.installments ? `<div class="kv"><span class="k">Cuota</span><span class="v">${amt(l.installmentAmount)} ${Engine.FREQ[l.frequency]?.label.toLowerCase() || ''}</span></div>` : ''}
        ${ls.interestPaid ? `<div class="kv"><span class="k">Intereses pagados</span><span class="v">${amt(ls.interestPaid)}</span></div>` : ''}
        <div class="actions"><button class="btn btn-s btn-accent" data-action="pay-loan" data-id="${l.id}" ${ls.closed ? 'disabled' : ''}>Registrar pago</button></div>
        <details class="more"><summary>${icon('right')}Evolución y pagos</summary><div>
          ${ls.history.length > 1 ? sparkline(ls.history) : '<p class="note">La evolución aparece cuando registres pagos.</p>'}
          ${rows ? `<div class="table-wrap mt"><table><thead><tr><th>Fecha</th><th>Tipo</th><th class="r">Pago</th><th class="r">Interés</th><th class="r">Capital</th></tr></thead><tbody>${rows}</tbody></table></div>` : ''}
          ${ls.schedule.length ? `<p class="small mt" style="font-weight:650">Próximas cuotas</p><div class="table-wrap"><table><tbody>${ls.schedule.slice(0, 6).map((s) => `<tr><td>${s.n ? `${s.n}/${s.of}` : ''}</td><td>${dl(s.date, { year: true })}</td><td class="r amt">${esc(fmt(s.amount))}</td></tr>`).join('')}</tbody></table></div>${ls.schedule.length > 6 ? `<p class="note">Y ${ls.schedule.length - 6} cuotas más.</p>` : ''}` : ''}
          ${l.notes ? `<p class="note">${esc(l.notes)}</p>` : ''}
        </div></details>
      </section>`;
    }).join('')}</div>`;
  }

  function sparkline(hist) {
    const W = 320, H = 70, pad = 6;
    const max = Math.max(...hist.map((h) => h.balance), 1);
    const pts = hist.map((h, i) => [pad + i * (W - 2 * pad) / Math.max(1, hist.length - 1), H - pad - Math.max(0, h.balance) / max * (H - 2 * pad)]);
    const last = hist[hist.length - 1];
    return `<figure style="margin:0"><svg viewBox="0 0 ${W} ${H}" role="img" aria-label="Saldo de ${fmt(hist[0].balance)} a ${fmt(last.balance)}" style="width:100%;height:auto">
      <line x1="${pad}" x2="${W - pad}" y1="${H - pad}" y2="${H - pad}" stroke="var(--line)" />
      <polyline points="${pts.map((p) => p.map((n) => n.toFixed(1)).join(',')).join(' ')}" fill="none" stroke="var(--accent)" stroke-width="2" stroke-linejoin="round" stroke-linecap="round"/>
      ${pts.map((p) => `<circle cx="${p[0].toFixed(1)}" cy="${p[1].toFixed(1)}" r="3" fill="var(--surface)" stroke="var(--accent)" stroke-width="2"/>`).join('')}
    </svg><figcaption class="row between xs muted"><span>${dl(hist[0].date, { year: true })}: ${esc(fmt(hist[0].balance))}</span><span>Hoy: ${esc(fmt(last.balance))}</span></figcaption></figure>`;
  }

  /* ======================= PROYECCIÓN ======================= */
  function viewProjection() {
    const pr = Engine.project(state, today, ui.projMonths);
    const proj = state.settings.projection;
    const sug = Engine.suggestVariable(state, today);
    const share = Engine.cardShare(state, today);
    const fd = pr.firstDeficit;
    const alert = fd ? `<div class="banner banner-neg">${icon('alert')}<div class="grow"><b>Déficit en ${Engine.periodLabel(fd.period)}:</b> te faltarían <b class="amt">${esc(fmt(-fd.closing))}</b> para cubrir lo previsto. ${pr.rows.filter((r) => r.closing < 0).length > 1 ? `Hay ${pr.rows.filter((r) => r.closing < 0).length} meses en negativo en este horizonte.` : ''}</div></div>`
      : `<div class="banner">${icon('check')}<div class="grow">Sin déficit en los próximos ${ui.projMonths} meses. El saldo más bajo sería <b class="amt">${esc(fmt(pr.minRow.closing))}</b> en ${Engine.periodLabel(pr.minRow.period)}.</div></div>`;
    const seg = `<div class="seg" role="group" aria-label="Horizonte">${[3, 6, 12].map((n) => `<button aria-pressed="${ui.projMonths === n}" data-action="proj-months" data-n="${n}">${n} meses</button>`).join('')}</div>`;
    const rows = pr.rows.map((r) => {
      const open = ui.openProj === r.period;
      const estPart = r.estimatedOut + r.estimatedIn;
      return `<tr class="clickable ${r.closing < 0 ? 'neg-row' : ''}" data-action="proj-open" data-p="${r.period}" aria-expanded="${open}"><td><span class="row" style="gap:6px">${icon(open ? 'left' : 'right')}${capital(Engine.periodLabel(r.period))}</span></td>
        <td class="r"><span class="amt">${esc(fmt(r.income))}</span>${r.estimatedIn ? `<div class="xs muted">${esc(fmt(r.estimatedIn))} estimado</div>` : ''}</td>
        <td class="r"><span class="amt">${esc(fmt(r.out))}</span>${r.estimatedOut ? `<div class="xs muted">${esc(fmt(r.estimatedOut))} estimado</div>` : ''}</td>
        <td class="r"><b class="amt ${r.closing < 0 ? 'neg' : ''}">${esc(fmt(r.closing))}</b></td></tr>
        ${open ? `<tr class="detail-row"><td colspan="4">${projDetail(r)}</td></tr>` : ''}`;
    }).join('');
    const extras = (proj.extras || []).slice().sort((a, b) => a.period.localeCompare(b.period));
    return `${Store.profile === 'demo' ? topBanners() : ''}<div class="page-head"><div><h1>Proyección</h1><p class="sub">Saldo esperado mes a mes, desde tu disponible de hoy (${esc(fmt(pr.start))})</p></div>${seg}</div>
      ${alert}
      ${pr.warnings.map((w) => `<div class="banner banner-warn">${icon('info')}<div class="grow">${esc(w)}</div></div>`).join('')}
      <section class="card"><div class="card-head"><h2>Saldo proyectado a fin de cada mes</h2></div>${projChart(pr)}</section>
      <section class="card"><div class="table-wrap"><table><thead><tr><th>Mes</th><th class="r">Ingresos</th><th class="r">Pagos previstos</th><th class="r">Saldo proyectado</th></tr></thead><tbody>${rows}</tbody></table></div>
        <p class="note">Tocá un mes para ver el detalle. “Confirmado” son importes registrados o pactados (cuotas, gastos fijos de importe cierto); “estimado” son supuestos que podés ajustar.</p></section>
      <div class="grid grid-2 mt">
        <section class="card"><h2>Gasto del día a día</h2><p class="small muted mt-s">Supermercado, delivery, farmacia y todo lo que no es fijo ni en cuotas. Lo registrado en el mes se descuenta de la estimación.</p>
          <form class="row wrap mt" data-form="variable"><div class="money-wrap" style="flex:1;min-width:160px"><input class="input" name="v" inputmode="decimal" value="${esc(moneyInput(proj.variableMonthly))}" aria-label="Estimación mensual del día a día"></div><button class="btn btn-primary">Guardar</button></form>
          <p class="note">${sug ? `Promedio de tus últimos 3 meses: <b class="amt">${esc(fmt(sug))}</b> <button class="btn btn-ghost btn-s" data-action="use-suggest" data-v="${sug}">Usar este valor</button>` : 'Cuando tengas meses completos registrados, te sugerimos un promedio.'}${share > 0 ? ` Suele pagarse ${Math.round(share * 100)}% con tarjeta: esa parte sale de caja al mes siguiente.` : ''}</p></section>
        <section class="card"><div class="card-head"><h2>Supuestos extraordinarios</h2><button class="btn btn-s" data-action="new-extra">${icon('plus')}Agregar</button></div>
          ${extras.length ? `<div class="list">${extras.map((x) => `<button class="item" data-action="edit-extra" data-id="${x.id}"><span class="ico ${x.dir === 'in' ? 'in' : ''}">${icon(x.dir === 'in' ? 'in' : 'out')}</span><span class="main"><span class="title">${esc(x.label)}</span><span class="meta"><span>${capital(Engine.periodLabel(x.period))}</span><span>Supuesto</span></span></span><span class="end">${amt(x.dir === 'in' ? x.amount : -x.amount, { sign: x.dir === 'in' })}</span></button>`).join('')}</div>`
            : '<p class="small muted">Gastos o ingresos que esperás pero todavía no están registrados: un arreglo, un bono, un viaje. Solo afectan la proyección.</p>'}</section>
      </div>`;
  }

  function projDetail(r) {
    const GL = { ingresos: 'Ingresos', fijos: 'Gastos fijos y servicios', prestamos: 'Cuotas de préstamos', tarjetas: 'Resúmenes de tarjetas', variables: 'Día a día', pendientes: 'Otros pendientes registrados', extra: 'Supuestos' };
    const groups = Object.keys(GL).map((g) => [g, r.items.filter((i) => i.group === g)]).filter(([, it]) => it.length);
    const override = state.settings.projection.overrides?.[r.period];
    return `<div class="stack" style="gap:10px">${groups.map(([g, it]) => `<div><div class="row between small" style="font-weight:650"><span>${GL[g]}</span><span class="amt">${esc(fmt(it.reduce((s, i) => s + (i.dir === 'in' ? i.amount : -i.amount), 0), { sign: true }))}</span></div>

  function projChart(pr) {
    const rows = pr.rows; const n = rows.length;
    const W = 760, H = 240, padL = 8, padR = 8, padT = 22, padB = 30;
    const vals = rows.map((r) => r.closing);
    const max = Math.max(0, ...vals), min = Math.min(0, ...vals);
    const span = max - min || 1;
    const y = (v) => padT + (max - v) / span * (H - padT - padB);
    const slot = (W - padL - padR) / n; const bw = Math.min(46, slot * 0.58);
    const minIdx = vals.indexOf(Math.min(...vals));
    const bars = rows.map((r, i) => {
      const x = padL + slot * i + (slot - bw) / 2; const y0 = y(0), y1 = y(r.closing);
      const top = Math.min(y0, y1), h = Math.max(2, Math.abs(y1 - y0));
      const neg = r.closing < 0; const r4 = Math.min(4, h / 2);
      const path = neg
        ? `M${x},${top} h${bw} v${h - r4} q0,${r4} -${r4},${r4} h-${bw - 2 * r4} q-${r4},0 -${r4},-${r4} z`
        : `M${x},${top + h} v-${h - r4} q0,-${r4} ${r4},-${r4} h${bw - 2 * r4} q${r4},0 ${r4},${r4} v${h - r4} z`;
      const showLabel = neg || i === minIdx || i === n - 1;
      const lbl = showLabel ? `<text x="${x + bw / 2}" y="${neg ? y0 - 6 : top - 6}" text-anchor="middle" font-size="11" fill="${neg ? 'var(--neg)' : 'var(--ink-2)'}" font-weight="600">${esc(compact(r.closing))}</text>` : '';
      return `<g class="pbar" data-i="${i}" tabindex="0" role="listitem" aria-label="${Engine.periodLabel(r.period)}: ${esc(fmt(r.closing))}">
        <rect x="${padL + slot * i}" y="${padT - 10}" width="${slot}" height="${H - padT - padB + 10}" fill="transparent"/>
        <path d="${path}" fill="${neg ? 'var(--neg)' : 'var(--accent)'}"/>${lbl}
        <text x="${x + bw / 2}" y="${H - 10}" text-anchor="middle" font-size="11" fill="var(--muted)">${Engine.periodLabel(r.period, true).split(' ')[0]}</text></g>`;
    }).join('');
    return `<div class="chart" id="proj-chart"><svg viewBox="0 0 ${W} ${H}" role="list" aria-label="Saldo proyectado por mes">
      <line x1="${padL}" x2="${W - padR}" y1="${y(0)}" y2="${y(0)}" stroke="var(--line-2)" stroke-width="1"/>${bars}</svg><div class="tip" aria-hidden="true"></div></div>`;
  }
  function compact(c) {
    const v = c / 100; const a = Math.abs(v); const s = v < 0 ? '−' : '';
    if (a >= 1e6) return `${s}$${(a / 1e6).toLocaleString('es-AR', { maximumFractionDigits: 2 })} M`;
    if (a >= 1e3) return `${s}$${Math.round(a / 1e3).toLocaleString('es-AR')} mil`;
    return `${s}$${Math.round(a)}`;
  }

  /* =====================================================================
     Formularios (diálogos), acciones y eventos

  /** Centavos → texto editable en formato AR, sin símbolo. */
  function moneyInput(c) {
    if (c == null || c === '' || Number.isNaN(c)) return '';
    const neg = c < 0; const a = Math.abs(c);
    const ent = Math.floor(a / 100).toLocaleString('es-AR');
    const dec = a % 100 ? ',' + String(a % 100).padStart(2, '0') : '';
    return (neg ? '-' : '') + ent + dec;
  }

  /* ---------------- Diálogo genérico ---------------- */
  let modalHandlers = null;
  /**
   * Abre un diálogo con un formulario.
   * onSubmit(form, data) → devuelve objeto de errores {campo: mensaje} o nada para cerrar.
   */
  function openModal({ title, body, submit = 'Guardar', onSubmit, onInput, extraFoot = '', danger = null }) {
    const dlg = $('#modal');
    dlg.innerHTML = `<form novalidate>
      <div class="sheet-head"><h2 id="modal-title">${esc(title)}</h2><button type="button" class="btn btn-ghost btn-icon" data-close aria-label="Cerrar">${icon('x')}</button></div>
      <div class="sheet-body">${body}</div>
      <div class="sheet-foot">${danger ? `<button type="button" class="btn btn-danger" data-danger>${icon('trash')}${esc(danger.label)}</button>` : ''}${extraFoot}<span class="grow"></span><button type="button" class="btn" data-close>Cancelar</button>${submit ? `<button type="submit" class="btn btn-primary">${esc(submit)}</button>` : ''}</div>
    </form>`;
    const form = $('form', dlg);
    modalHandlers = { onSubmit, onInput };
    form.addEventListener('submit', (e) => {
      e.preventDefault();
      clearErrors(form);
      const errs = onSubmit ? onSubmit(form, formData(form)) : null;
      if (errs && Object.keys(errs).length) { showErrors(form, errs); return; }
      closeModal();
    });
    form.addEventListener('input', (e) => {
      const f = e.target.closest('.field'); if (!f) return;
      f.querySelectorAll('.err').forEach((x) => x.remove());
      e.target.removeAttribute('aria-invalid');
    });
    if (onInput) { form.addEventListener('input', () => onInput(form)); form.addEventListener('change', () => onInput(form)); onInput(form); }
    $$('[data-close]', form).forEach((b) => (b.onclick = closeModal));
    dlg.onclick = (e) => { const b = e.target.closest('[data-goto]'); if (b) { closeModal(); ui.debtTab = b.dataset.tab; go(b.dataset.goto); } };
    if (danger) $('[data-danger]', form).onclick = () => { if (danger.onClick() !== false) closeModal(); };
    $$('input.money', form).forEach((inp) => inp.addEventListener('blur', () => { const c = Money.parse(inp.value); if (!Number.isNaN(c)) inp.value = moneyInput(c); }));
    dlg.showModal();
    const first = $('[autofocus]', form) || $('input:not([type=hidden]):not([type=radio]):not([type=checkbox]), select', form);
    if (first) first.focus();
  }
  function closeModal() { const d = $('#modal'); if (d.open) d.close(); modalHandlers = null; }
  function formData(form) { const o = {}; for (const [k, v] of new FormData(form)) o[k] = typeof v === 'string' ? v.trim() : v; return o; }
  function clearErrors(form) { $$('.err', form).forEach((e) => e.remove()); $$('[aria-invalid]', form).forEach((e) => e.removeAttribute('aria-invalid')); }
  function showErrors(form, errs) {
    let first = null;
    for (const [name, msg] of Object.entries(errs)) {
      const inp = form.elements[name];
      const el = inp && (inp.length && !inp.tagName ? inp[0] : inp);
      const field = el?.closest('.field') || $('.sheet-body', form);
      if (el && el.setAttribute) { el.setAttribute('aria-invalid', 'true'); first = first || el; }
      const p = document.createElement('p'); p.className = 'err'; p.id = 'err-' + name; p.textContent = msg; field.appendChild(p);
      if (el && el.setAttribute) el.setAttribute('aria-describedby', p.id);
    }
    (first || $('.err', form))?.focus?.();
  }
  const fld = (label, control, { hint = '', cls = '', id = '' } = {}) => `<div class="field ${cls}">${label ? `<label ${id ? `for="${id}"` : ''}>${label}</label>` : ''}${control}${hint ? `<p class="hint">${hint}</p>` : ''}</div>`;
  const moneyField = (name, label, value, { big = false, hint = '', autofocus = false, cls = '', placeholder = '' } = {}) =>
    fld(label, `<div class="money-wrap ${big ? 'big' : ''}"><input class="input money ${big ? 'input-money' : ''}" id="f-${name}" name="${name}" inputmode="decimal" autocomplete="off" value="${esc(value == null ? '' : moneyInput(value))}" placeholder="${esc(placeholder || '0')}" ${autofocus ? 'autofocus' : ''}></div>`, { hint, cls, id: `f-${name}` });
  const dateField = (name, label, value, opts = {}) => fld(label, `<input class="input" type="date" id="f-${name}" name="${name}" value="${esc(value || '')}">`, { ...opts, id: `f-${name}` });
  const textField = (name, label, value, { hint = '', cls = '', placeholder = '', list = '', maxlength = 80, autofocus = false } = {}) =>
    fld(label, `<input class="input" id="f-${name}" name="${name}" value="${esc(value || '')}" placeholder="${esc(placeholder)}" maxlength="${maxlength}" ${list ? `list="${list}"` : ''} ${autofocus ? 'autofocus' : ''} autocomplete="off">`, { hint, cls, id: `f-${name}` });
  const selectField = (name, label, options, value, { hint = '', cls = '' } = {}) =>
    fld(label, `<select class="input" id="f-${name}" name="${name}">${options}</select>`, { hint, cls, id: `f-${name}` }).replace(`value="${value}"`, `value="${value}" selected`);
  const opts = (pairs, value) => pairs.map(([v, l]) => `<option value="${esc(v)}" ${String(v) === String(value) ? 'selected' : ''}>${esc(l)}</option>`).join('');
  const segField = (name, label, pairs, value) => `<div class="field"><span class="label">${label}</span><div class="seg" role="radiogroup" aria-label="${esc(label)}">${pairs.map(([v, l]) => `<label><input type="radio" name="${name}" value="${v}" ${v === value ? 'checked' : ''}><span>${l}</span></label>`).join('')}</div></div>`;
  function catOptions(kind, value) {
    return Store.GROUPS.filter((g) => g.kind === kind).map((g) => `<optgroup label="${esc(g.name)}">${state.categories.filter((c) => c.group === g.id).map((c) => `<option value="${c.id}" ${c.id === value ? 'selected' : ''}>${esc(c.name)}</option>`).join('')}</optgroup>`).join('');
  }
  const accountOpts = (value, { includeArchived = false } = {}) => state.accounts.filter((a) => includeArchived || !a.archived || a.id === value).map((a) => `<option value="${a.id}" ${a.id === value ? 'selected' : ''}>${esc(a.name)}</option>`).join('');

  const parseMoneyReq = (v, errs, key, { allowZero = false, allowNeg = false } = {}) => {
    const c = Money.parse(v);
    if (Number.isNaN(c)) errs[key] = 'Ingresá un importe válido, por ejemplo 12.500 o 12500,50.';
    else if (!allowNeg && c < 0) errs[key] = 'El importe no puede ser negativo.';
    else if (!allowZero && c === 0) errs[key] = 'El importe debe ser mayor a cero.';
    return c;
  };
  const parseMoneyOpt = (v, errs, key) => { if (!v) return null; return parseMoneyReq(v, errs, key, { allowZero: true }); };
