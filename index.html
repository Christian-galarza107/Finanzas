      $('[data-lbl="medio"]', form).textContent = k === 'transferencia' ? 'Desde la cuenta' : k === 'ingreso' ? 'Cuenta donde entra' : 'Medio de pago';
      $('[data-lbl="paid"]', form).textContent = k === 'ingreso' ? 'Cobrado' : 'Pagado';
      const date = form.elements.date.value;
      const future = D.valid(date) && date > today;
      show('futurehint', future && !isCard && form.elements.status.value === 'pagado');
      // Información de la tarjeta: en qué resumen entra y valor de cuota
      const amount = Money.parse(form.elements.amount.value);
      if (isCard && D.valid(date)) {
        const c = card(m); const n = Math.max(1, parseInt(form.elements.installments.value, 10) || 1);
        const per = Engine.cardPeriodFor(c, date); const sd = Engine.statementDates(c, per);
        const q = !Number.isNaN(amount) && amount > 0 ? Money.split(amount, n) : null;
        $('[data-show="cardinfo"]', form).innerHTML = `${q ? `${n > 1 ? `${n} cuotas de <b>${esc(fmt(q[n - 1]))}</b>${q[0] !== q[n - 1] ? ` (la primera de ${esc(fmt(q[0]))})` : ''}. ` : ''}` : ''}Entra en el resumen de ${Engine.periodLabel(per)}, que vence el ${dl(sd.dueDate)}${sd.estimated ? ' (estimado)' : ''}. Cuenta como gasto hoy; tu saldo disponible no cambia hasta que pagues el resumen.`;
        show('cardinfo', true);
      } else show('cardinfo', false);
      // Aviso de doble conteo
      const c = cat(form.elements.categoryId.value);
      const risky = k === 'gasto' && c && (c.id === 'cat-resumenes' || c.group === 'prestamos');
      if (risky) $('[data-show="debtcat"]', form).innerHTML = `Para pagar ${c.group === 'prestamos' ? 'una cuota de un préstamo' : 'el resumen de una tarjeta'} usá <b>Deudas y tarjetas → ${c.group === 'prestamos' ? 'Registrar pago' : 'Pagar resumen'}</b>: así baja la deuda y el gasto no se cuenta dos veces. <button type="button" class="btn btn-s mt-s" data-goto="deudas" data-tab="${c.group === 'prestamos' ? 'prestamos' : 'tarjetas'}">Ir a Deudas y tarjetas</button>`;
      show('debtcat', risky);
    };
    openModal({
      title: existing ? 'Editar movimiento' : 'Nuevo movimiento',
      body,
      submit: existing ? 'Guardar cambios' : 'Guardar',
      onInput: update,
      danger: existing ? { label: 'Eliminar', onClick: () => { deleteTx(existing.id); } } : null,
      onSubmit: (form, d) => {
        const errs = {};
        const amount = parseMoneyReq(d.amount, errs, 'amount');
        if (!D.valid(d.date)) errs.date = 'Elegí una fecha válida.';
        const k = d.kind;
        const isCard = k === 'gasto' && state.cards.some((c) => c.id === d.medio);
        if (k !== 'transferencia' && !d.categoryId) errs.categoryId = 'Elegí una categoría.';
        if (!d.medio) errs.medio = 'Elegí una cuenta.';
        if (k === 'transferencia' && d.medio === d.toAccountId) errs.toAccountId = 'La cuenta de destino debe ser distinta.';
        const inst = isCard ? parseInt(d.installments, 10) : 1;
        if (isCard && (!(inst >= 1) || inst > 60)) errs.installments = 'Indicá entre 1 y 60 cuotas.';
        let status = isCard ? 'pagado' : d.status;
        if (!isCard && status === 'pagado' && d.date > today) status = 'pendiente';
        if (Object.keys(errs).length) return errs;
        const data = {
          kind: k, amount, date: d.date, description: d.description, categoryId: k === 'transferencia' ? null : d.categoryId,
          accountId: isCard ? null : d.medio, cardId: isCard ? d.medio : null, toAccountId: k === 'transferencia' ? d.toAccountId : null,
          installments: isCard ? inst : 1, status,
        };
        if (isCard) data.firstPeriod = Engine.cardPeriodFor(card(d.medio), d.date);
        if (existing) {
          commit((s) => {
            const tx = s.txs.find((x) => x.id === existing.id);
            const amountChanged = tx.amount !== amount;
            Object.assign(tx, data);
            delete tx.paidDate;
            if (tx.recId && amountChanged) tx.manualAmount = true;
          }, 'Movimiento actualizado', { undo: true });
        } else {
          commit((s) => {
            const tx = { id: Store.uid(), createdAt: Date.now(), ...data };
            if (d.repeat && k !== 'transferencia') {
              const rec = { id: Store.uid(), name: d.description || cat(d.categoryId)?.name || 'Recurrente', type: k, categoryId: d.categoryId, accountId: data.accountId, cardId: data.cardId, frequency: 'mensual', startDate: d.date, dueDay: D.parts(d.date).d, endDate: null, active: true, estimated: false, skipped: [], amounts: [{ from: D.period(d.date), amount }], materializeFrom: D.addPeriod(D.period(d.date), 1) };
              s.recurrings.push(rec); tx.recId = rec.id; tx.recPeriod = D.period(d.date);
            }
            s.txs.push(tx);
          }, k === 'ingreso' ? 'Ingreso registrado' : k === 'transferencia' ? 'Transferencia registrada' : isCard ? 'Compra con tarjeta registrada' : 'Gasto registrado', { undo: true });
        }
      },
    });
    // autocompletar por descripción
    const form = $('#modal form');
    form.elements.description.addEventListener('change', () => {
      if (existing) return;
      const prev = mem.get(form.elements.description.value.trim().toLowerCase());
      if (!prev) return;
      const kr = [...form.elements.kind].find((r) => r.value === prev.kind); if (kr) kr.checked = true;
      lastKind = null; update(form);
      form.elements.categoryId.value = prev.categoryId;
      const m = prev.cardId || prev.accountId; if ([...form.elements.medio.options].some((o) => o.value === m)) form.elements.medio.value = m;
      if (!form.elements.amount.value) form.elements.amount.value = moneyInput(prev.amount);
      update(form);
    });
  }

  function deleteTx(id) {
    const tx = state.txs.find((t) => t.id === id);
    if (!tx) return;
    commit((s) => {
      s.txs = s.txs.filter((t) => t.id !== id);
      if (tx.recId) { const r = s.recurrings.find((x) => x.id === tx.recId); if (r && !r.skipped.includes(tx.recPeriod)) r.skipped.push(tx.recPeriod); }
    }, 'Movimiento eliminado', { undo: true });
  }

  /** Desde un vencimiento: confirmar pago con importe (permite ajustar si el monto real cambió). */
  function payTxForm(id) {
    const tx = state.txs.find((t) => t.id === id); if (!tx) return;
    const isIn = tx.kind === 'ingreso';
    openModal({
      title: isIn ? 'Registrar cobro' : 'Registrar pago',
      submit: isIn ? 'Marcar cobrado' : 'Marcar pagado',
      body: `<div class="form-grid"><p class="small"><b>${esc(tx.description || cat(tx.categoryId)?.name)}</b>${tx.date < today ? ` <span class="pill pill-neg">Venció ${dl(tx.date)}</span>` : ` · vence ${dl(tx.date)}`}</p>
        ${moneyField('amount', 'Importe', tx.amount, { big: true, hint: tx.estimated ? 'Era un importe estimado: ajustalo al real si cambió.' : '' })}
        <div class="form-grid two">${dateField('paidDate', isIn ? 'Fecha de cobro' : 'Fecha de pago', today)}${fld(isIn ? 'Cuenta' : 'Pagado desde', `<select class="input" name="accountId" id="f-acc">${accountOpts(tx.accountId)}</select>`, { id: 'f-acc' })}</div></div>`,
      onSubmit: (form, d) => {
        const errs = {}; const amount = parseMoneyReq(d.amount, errs, 'amount');
        if (!D.valid(d.paidDate)) errs.paidDate = 'Elegí una fecha válida.';
        else if (d.paidDate > today) errs.paidDate = 'La fecha de pago no puede ser futura.';
        if (Object.keys(errs).length) return errs;
        commit((s) => { const t = s.txs.find((x) => x.id === id); if (t.amount !== amount && t.recId) t.manualAmount = true; t.amount = amount; t.status = 'pagado'; t.paidDate = d.paidDate; t.accountId = d.accountId; }, isIn ? 'Cobro registrado' : 'Pago registrado', { undo: true });
      },
    });
  }

  function simpleLoanInForm(tx) {
    openModal({
      title: 'Préstamo recibido', submit: 'Guardar cambios',
      body: `<div class="form-grid">${moneyField('amount', 'Importe recibido', tx.amount, { big: true })}${dateField('date', 'Fecha', tx.date)}${fld('Cuenta', `<select class="input" name="accountId">${accountOpts(tx.accountId)}</select>`)}</div>`,
      danger: { label: 'Eliminar', onClick: () => deleteTx(tx.id) },
      onSubmit: (form, d) => { const errs = {}; const amount = parseMoneyReq(d.amount, errs, 'amount'); if (!D.valid(d.date)) errs.date = 'Fecha inválida.'; if (Object.keys(errs).length) return errs; commit((s) => Object.assign(s.txs.find((x) => x.id === tx.id), { amount, date: d.date, accountId: d.accountId }), 'Movimiento actualizado', { undo: true }); },
    });
  }

  /* ======================= RECURRENTES ======================= */
  function recForm(existing = null) {
    const r = existing || { type: 'gasto', frequency: 'mensual', startDate: today, dueDay: D.parts(today).d, active: true, estimated: false, accountId: state.accounts[0]?.id };
    const P = D.period(today);
    const curAmount = existing ? Engine.recAmountFor(r, P) : null;
    const medio = r.cardId || r.accountId;
    const body = `<div class="form-grid">
      ${segField('type', 'Tipo', [['gasto', 'Gasto fijo'], ['ingreso', 'Ingreso']], r.type)}
      ${textField('name', 'Nombre', r.name, { placeholder: 'Ej.: Alquiler', autofocus: !existing })}
      <div class="form-grid two">${moneyField('amount', 'Importe habitual', curAmount)}${fld('Categoría', '<select class="input" id="f-categoryId" name="categoryId"></select>', { id: 'f-categoryId' })}</div>
      ${existing ? `<div data-show="from">${selectField('from', 'Aplicar el nuevo importe desde', opts([0, 1, 2, 3].map((i) => [D.addPeriod(P, i), capital(Engine.periodLabel(D.addPeriod(P, i)))]), P), P, { hint: 'Los meses anteriores y los ya pagados no se modifican.' })}</div>` : ''}
      <div class="form-grid two">
        ${selectField('frequency', 'Frecuencia', opts(['mensual', 'bimestral', 'trimestral', 'semestral', 'anual'].map((f) => [f, Engine.FREQ[f].label]), r.frequency), r.frequency)}
        ${fld('Día de vencimiento', `<input class="input" type="number" min="1" max="31" name="dueDay" id="f-dueDay" value="${r.dueDay}">`, { id: 'f-dueDay', hint: 'Si el mes es más corto, se usa el último día.' })}
        ${dateField('startDate', 'Fecha de inicio', r.startDate)}
        ${dateField('endDate', 'Finaliza (opcional)', r.endDate)}
      </div>
      ${fld('<span data-lbl="medio">Medio de pago</span>', '<select class="input" id="f-medio" name="medio"></select>', { id: 'f-medio' })}
      <label class="check"><input type="checkbox" name="estimated" ${r.estimated ? 'checked' : ''}><span>El importe varía cada mes<br><span class="small muted">Se muestra como estimado en la proyección (luz, gas, expensas).</span></span></label>
      ${existing ? `<label class="check"><input type="checkbox" name="active" ${r.active ? 'checked' : ''}><span>Activo<br><span class="small muted">Si lo pausás, deja de generar movimientos nuevos.</span></span></label>` : ''}
      <p class="callout" data-show="next"></p>
    </div>`;
    let lastType = null;
    openModal({
      title: existing ? 'Editar recurrente' : 'Nuevo recurrente', body,
      danger: existing ? { label: 'Eliminar', onClick: () => {
        commit((s) => { s.recurrings = s.recurrings.filter((x) => x.id !== r.id); s.txs = s.txs.filter((t) => !(t.recId === r.id && t.status === 'pendiente')); }, 'Recurrente eliminado. Los pagos ya hechos quedan en el historial.', { undo: true });
      } } : null,
      onInput: (form) => {
        const ty = form.elements.type.value;
        if (ty !== lastType) {
          const cs = form.elements.categoryId; cs.innerHTML = catOptions(ty, cs.value || r.categoryId);
          const ms = form.elements.medio; const keep = ms.value || medio;
          ms.innerHTML = `<optgroup label="Cuentas">${accountOpts(keep)}</optgroup>${ty === 'gasto' && state.cards.length ? `<optgroup label="Tarjetas de crédito (débito automático)">${cardOpts(keep)}</optgroup>` : ''}`;
          if ([...ms.options].some((o) => o.value === keep)) ms.value = keep;
          lastType = ty;
        }
        $('[data-lbl="medio"]', form).textContent = ty === 'ingreso' ? 'Cuenta donde entra' : 'Se paga con';
        const fromF = $('[data-show="from"]', form);
        if (fromF) fromF.hidden = Money.parse(form.elements.amount.value) === curAmount;
        const dd = parseInt(form.elements.dueDay.value, 10); const sd = form.elements.startDate.value;
        const nextEl = $('[data-show="next"]', form);
        if (!existing && dd >= 1 && dd <= 31 && D.valid(sd)) {
          const tmp = { startDate: sd, dueDay: dd, frequency: form.elements.frequency.value, active: true };
          let p = D.period(sd) < P ? P : D.period(sd); let first = null;
          for (let i = 0; i < 24 && !first; i++, p = D.addPeriod(p, 1)) if (Engine.recOccursIn(tmp, p)) { const d = Engine.recDueDate(tmp, p); if (d >= today || D.period(sd) > P) first = d; }
          nextEl.innerHTML = first ? `Primer vencimiento que se genera: <b>${dl(first, { year: true })}</b>.` : '';
          nextEl.hidden = !first;
        } else nextEl.hidden = true;
      },
      onSubmit: (form, d) => {
        const errs = {};
        if (!d.name) errs.name = 'Poné un nombre.';
        const amount = parseMoneyReq(d.amount, errs, 'amount');
        const dueDay = parseInt(d.dueDay, 10);
        if (!(dueDay >= 1 && dueDay <= 31)) errs.dueDay = 'Indicá un día entre 1 y 31.';
        if (!D.valid(d.startDate)) errs.startDate = 'Elegí la fecha de inicio.';
        if (d.endDate && (!D.valid(d.endDate) || d.endDate < d.startDate)) errs.endDate = 'La fecha de fin debe ser posterior al inicio.';
        if (!d.categoryId) errs.categoryId = 'Elegí una categoría.';
        if (Object.keys(errs).length) return errs;
        const isCard = state.cards.some((c) => c.id === d.medio);
        const base = { name: d.name, type: d.type, categoryId: d.categoryId, accountId: isCard ? null : d.medio, cardId: isCard ? d.medio : null, frequency: d.frequency, dueDay, startDate: d.startDate, endDate: d.endDate || null, estimated: !!d.estimated };
        if (!existing) {
          commit((s) => {
            // no generar vencimientos ya pasados al crear: arranca en el próximo
            let from = D.period(d.startDate) < P ? P : D.period(d.startDate);
            const tmp = { ...base, active: true };
            if (from === P && Engine.recOccursIn(tmp, P) && Engine.recDueDate(tmp, P) < today) from = D.addPeriod(P, 1);
            s.recurrings.push({ id: Store.uid(), ...base, active: true, skipped: [], amounts: [{ from: D.period(d.startDate) < from ? D.period(d.startDate) : from, amount }], materializeFrom: from });
          }, 'Recurrente creado');
        } else {
          commit((s) => {
            const rec = s.recurrings.find((x) => x.id === r.id);
            Object.assign(rec, base, { active: !!d.active });
            if (amount !== curAmount) {
              const from = d.from || P;
              rec.amounts = rec.amounts.filter((a) => a.from !== from).concat({ from, amount });
            }
            // actualizar pendientes futuros generados (no los pagados ni los editados a mano)
            for (const t of s.txs) {
              if (t.recId !== rec.id || t.status !== 'pendiente') continue;
              t.description = rec.name; t.categoryId = rec.categoryId; t.estimated = rec.estimated;
              if (!rec.cardId) t.accountId = rec.accountId;
              if (!t.manualAmount) t.amount = Engine.recAmountFor(rec, t.recPeriod);
              t.date = Engine.recDueDate(rec, t.recPeriod);
            }
          }, 'Recurrente actualizado', { undo: true });
        }
      },
    });
  }

  /* ======================= TARJETAS ======================= */
  function cardForm(existing = null) {
    const c = existing || { closingDay: 25, dueDay: 7 };
    openModal({
      title: existing ? 'Editar tarjeta' : 'Nueva tarjeta',
      body: `<div class="form-grid">
        ${textField('name', 'Nombre', c.name, { placeholder: 'Ej.: Visa Banco', autofocus: true, hint: 'Un nombre para reconocerla. No cargues el número de la tarjeta.' })}
        <div class="form-grid two">
          ${fld('Día de cierre', `<input class="input" type="number" min="1" max="31" name="closingDay" id="f-cd" value="${c.closingDay}">`, { id: 'f-cd' })}
          ${fld('Día de vencimiento', `<input class="input" type="number" min="1" max="31" name="dueDay" id="f-dd" value="${c.dueDay}">`, { id: 'f-dd', hint: 'Si es menor al cierre, vence el mes siguiente.' })}
        </div>
        ${moneyField('limit', 'Límite de compra (opcional)', c.limit)}
        ${existing ? '<p class="callout">Cambiar el cierre no mueve compras ya registradas: solo afecta las nuevas y las fechas estimadas.</p>' : ''}
      </div>`,
      danger: existing ? { label: 'Eliminar', onClick: () => {
        const used = state.txs.some((t) => t.cardId === c.id);
        if (used) { if (!confirm('Esta tarjeta tiene movimientos. Se va a archivar: deja de mostrarse pero el historial se conserva. ¿Continuar?')) return false; commit((s) => { s.cards.find((x) => x.id === c.id).archived = true; }, 'Tarjeta archivada', { undo: true }); return; }
        commit((s) => { s.cards = s.cards.filter((x) => x.id !== c.id); }, 'Tarjeta eliminada', { undo: true });
      } } : null,
      onSubmit: (form, d) => {
        const errs = {};
        if (!d.name) errs.name = 'Poné un nombre.';
        if (d.name.replace(/\D/g, '').length >= 12) errs.name = 'Parece un número de tarjeta. Usá solo un nombre de referencia.';
        const cd = parseInt(d.closingDay, 10), dd = parseInt(d.dueDay, 10);
        if (!(cd >= 1 && cd <= 31)) errs.closingDay = 'Día entre 1 y 31.';
        if (!(dd >= 1 && dd <= 31)) errs.dueDay = 'Día entre 1 y 31.';
        if (cd === dd) errs.dueDay = 'El vencimiento no puede coincidir con el cierre.';
        const limit = parseMoneyOpt(d.limit, errs, 'limit');
        if (Object.keys(errs).length) return errs;
        if (existing) commit((s) => Object.assign(s.cards.find((x) => x.id === c.id), { name: d.name, closingDay: cd, dueDay: dd, limit }), 'Tarjeta actualizada', { undo: true });
        else commit((s) => s.cards.push({ id: Store.uid(), name: d.name, closingDay: cd, dueDay: dd, limit, statements: [], archived: false }), 'Tarjeta agregada');
      },
    });
  }

  function cardPaymentForm(cardId, existing = null) {
    const c = card(cardId); if (!c) return;
    const others = existing ? state.txs.filter((t) => t.id !== existing.id) : state.txs;
    const cs = Engine.cardState(c, others, today);
    const target = cs.nextToPay || cs.open;
    const st = target ? (c.statements || []).find((s) => s.period === target.period) : null;
    const total = cs.dueNow || (cs.open ? cs.open.outstanding : 0);
    openModal({
      title: existing ? 'Editar pago de tarjeta' : `Pagar ${c.name}`,
      submit: existing ? 'Guardar cambios' : 'Registrar pago',
      body: `<div class="form-grid">
        ${!existing ? `<div class="callout">${cs.dueNow ? `Saldo de resúmenes cerrados: <b>${esc(fmt(cs.dueNow))}</b>${cs.nextToPay ? `, vence ${dl(cs.nextToPay.dueDate)}` : ''}.` : cs.open ? `No hay resúmenes cerrados impagos. El resumen abierto suma <b>${esc(fmt(cs.open.outstanding))}</b>.` : 'Sin saldo pendiente.'}${st?.minimum ? ` Pago mínimo informado: <b>${esc(fmt(st.minimum))}</b>.` : ''}</div>
        <div class="row wrap">${total ? `<button type="button" class="btn btn-s" data-fill="${total}">Total ${esc(fmt(total))}</button>` : ''}${st?.minimum ? `<button type="button" class="btn btn-s" data-fill="${st.minimum}">Mínimo ${esc(fmt(st.minimum))}</button>` : ''}</div>` : ''}
        ${moneyField('amount', 'Importe pagado', existing ? existing.amount : total || null, { big: true, hint: 'Un pago parcial deja saldo pendiente. Los intereses se cargan cuando registres el próximo resumen.' })}
        <div class="form-grid two">${dateField('date', 'Fecha de pago', existing ? existing.date : today)}${fld('Pagado desde', `<select class="input" name="accountId" id="f-acc">${accountOpts(existing?.accountId || state.accounts.find((a) => a.type === 'banco')?.id)}</select>`, { id: 'f-acc' })}</div>
        <p class="note">El pago baja tu saldo disponible y cancela deuda de la tarjeta. No se cuenta como gasto: las compras ya se contaron cuando las hiciste.</p></div>`,
      danger: existing ? { label: 'Eliminar', onClick: () => deleteTx(existing.id) } : null,
      onSubmit: (form, d) => {
        const errs = {}; const amount = parseMoneyReq(d.amount, errs, 'amount');
        if (!D.valid(d.date)) errs.date = 'Elegí una fecha válida.'; else if (d.date > today) errs.date = 'Registrá el pago cuando lo hagas (la fecha no puede ser futura).';
        if (Object.keys(errs).length) return errs;
        if (existing) commit((s) => Object.assign(s.txs.find((x) => x.id === existing.id), { amount, date: d.date, accountId: d.accountId }), 'Pago actualizado', { undo: true });
        else commit((s) => s.txs.push({ id: Store.uid(), createdAt: Date.now(), kind: 'pago_tarjeta', cardId: c.id, amount, date: d.date, accountId: d.accountId, status: 'pagado', description: `Pago ${c.name}` }), 'Pago de tarjeta registrado', { undo: true });
      },
    });
    $('#modal').querySelectorAll('[data-fill]').forEach((b) => (b.onclick = () => { $('#modal form').elements.amount.value = moneyInput(+b.dataset.fill); }));
  }

  function statementForm(cardId) {
    const c = card(cardId); if (!c) return;
    const cs = Engine.cardState(c, state.txs, today);
    const closed = cs.periods.filter((p) => p.closingDate < today).map((p) => p.period);
    const candidates = [...new Set([...closed.slice(-3), cs.open?.period || D.period(today)])].filter(Boolean);
    const def = cs.nextToPay?.period || candidates[candidates.length - 1];
    const body = () => `<div class="form-grid">
      ${selectField('period', 'Resumen', opts(candidates.map((p) => [p, capital(Engine.periodLabel(p))]), def), def)}
      <div class="form-grid two">${dateField('closingDate', 'Fecha de cierre', '')}${dateField('dueDate', 'Fecha de vencimiento', '')}</div>
      ${moneyField('total', 'Total a pagar del resumen (opcional)', null, { hint: 'Si no lo tenés, dejalo vacío: no se inventa ningún saldo.' })}
      <div class="form-grid two">${moneyField('minimum', 'Pago mínimo (opcional)', null)}${moneyField('charges', 'Intereses y cargos (opcional)', null, { hint: 'Se registran como gasto en este resumen.' })}</div>
      <div class="callout" data-show="calc"></div>
      <label class="check" data-show="adj"><input type="checkbox" name="adjust" checked><span>Registrar la diferencia como “consumos no registrados”<br><span class="small muted">Así la deuda coincide con el resumen del banco.</span></span></label>
    </div>`;
    let lastP = null;
    openModal({
      title: `Resumen de ${c.name}`, body: body(), submit: 'Guardar resumen',
      onInput: (form) => {
        const p = form.elements.period.value;
        const per = cs.periods.find((x) => x.period === p);
        if (p !== lastP) {
          const sd = Engine.statementDates(c, p); const st = (c.statements || []).find((s) => s.period === p);
          form.elements.closingDate.value = sd.closingDate; form.elements.dueDate.value = sd.dueDate;
          form.elements.total.value = st?.declaredTotal ? moneyInput(st.declaredTotal) : '';
          form.elements.minimum.value = st?.minimum ? moneyInput(st.minimum) : '';
          lastP = p;
        }
        const prevUnpaid = cs.periods.filter((x) => x.period < p).reduce((s, x) => s + x.outstanding, 0);
        const charges = Money.parse(form.elements.charges.value) || 0;
        const expected = (per ? per.amount - per.paid : 0) + prevUnpaid + (charges > 0 ? charges : 0);
        const declared = Money.parse(form.elements.total.value);
        const diff = Number.isNaN(declared) ? 0 : declared - expected;
        $('[data-show="calc"]', form).innerHTML = `Según tus registros, este resumen suma <b>${esc(fmt(expected))}</b>${prevUnpaid ? ` (incluye ${esc(fmt(prevUnpaid))} impago de resúmenes anteriores)` : ''}.${!Number.isNaN(declared) && diff !== 0 ? ` El banco informa ${esc(fmt(declared))}: diferencia de <b>${esc(fmt(diff, { sign: true }))}</b>.${diff < 0 ? ' Revisá si alguna compra o cuota está mal cargada.' : ''}` : ''}`;
        $('[data-show="adj"]', form).hidden = !(diff > 0);
      },
      onSubmit: (form, d) => {
        const errs = {};
        if (!D.valid(d.closingDate)) errs.closingDate = 'Fecha inválida.';
        if (!D.valid(d.dueDate)) errs.dueDate = 'Fecha inválida.';
        else if (D.valid(d.closingDate) && d.dueDate <= d.closingDate) errs.dueDate = 'El vencimiento debe ser posterior al cierre.';
        const total = parseMoneyOpt(d.total, errs, 'total');
        const minimum = parseMoneyOpt(d.minimum, errs, 'minimum');
        const charges = parseMoneyOpt(d.charges, errs, 'charges');
        if (Object.keys(errs).length) return errs;
        const per = cs.periods.find((x) => x.period === d.period);
        const prevUnpaid = cs.periods.filter((x) => x.period < d.period).reduce((s, x) => s + x.outstanding, 0);
        const expected = (per ? per.amount - per.paid : 0) + prevUnpaid + (charges || 0);
        commit((s) => {
          const cc = s.cards.find((x) => x.id === c.id);
          cc.statements = cc.statements.filter((x) => x.period !== d.period).concat({ period: d.period, closingDate: d.closingDate, dueDate: d.dueDate, declaredTotal: total, minimum });
          if (charges > 0) s.txs.push({ id: Store.uid(), createdAt: Date.now(), kind: 'gasto', amount: charges, date: d.closingDate, categoryId: 'cat-intereses-y-cargos', description: `Intereses y cargos ${c.name}`, cardId: c.id, accountId: null, installments: 1, firstPeriod: d.period, status: 'pagado' });
          if (total != null && d.adjust && total - expected > 0) s.txs.push({ id: Store.uid(), createdAt: Date.now(), kind: 'gasto', amount: total - expected, date: d.closingDate, categoryId: s.categories.some((x) => x.id === 'cat-compras') ? 'cat-compras' : s.categories.find((x) => x.kind === 'gasto').id, description: `Consumos no registrados (${c.name})`, cardId: c.id, accountId: null, installments: 1, firstPeriod: d.period, status: 'pagado' });
        }, 'Resumen registrado', { undo: true });
      },
    });
  }

  /* ======================= PRÉSTAMOS ======================= */
  function loanForm(existing = null) {
    const l = existing || { creditorType: 'banco', frequency: 'mensual', rate: null, paidBefore: 0, accountId: state.accounts[0]?.id };
    const catFor = { banco: 'cat-prestamos-bancarios', empresa: 'cat-prestamos-de-la-empresa', familiar: 'cat-prestamos-familiares', amigo: 'cat-dinero-prestado-por-amigos', otro: 'cat-otros-compromisos' };
    const hasPays = existing && state.txs.some((t) => t.loanId === l.id);
    openModal({
      title: existing ? 'Editar préstamo o deuda' : 'Nuevo préstamo o deuda',
      body: `<div class="form-grid">
        <div class="form-grid two">${textField('creditor', 'Acreedor', l.creditor, { placeholder: 'Ej.: Banco, Juan, la empresa', autofocus: !existing })}
        ${selectField('creditorType', 'Tipo de acreedor', opts([['banco', 'Banco'], ['empresa', 'Empresa'], ['familiar', 'Familiar'], ['amigo', 'Amigo'], ['otro', 'Otro']], l.creditorType), l.creditorType)}</div>
        <div class="form-grid two">${moneyField('originalAmount', 'Importe original', l.originalAmount)}${moneyField('initialBalance', 'Saldo pendiente hoy', l.initialBalance, { hint: hasPays ? 'Saldo al registrar el préstamo. Los pagos posteriores se descuentan solos.' : 'Lo que debés al día de hoy. Si no lo sabés, dejalo vacío y cargá la cuota.' })}</div>
        <div class="form-grid two">
          ${fld('Cantidad de cuotas (opcional)', `<input class="input" type="number" min="1" max="600" name="installments" id="f-inst" value="${l.installments || ''}">`, { id: 'f-inst', hint: 'Vacío si no hay cuotas fijas.' })}
          ${fld('Cuotas ya pagadas', `<input class="input" type="number" min="0" max="600" name="paidBefore" id="f-pb" value="${l.paidBefore || 0}">`, { id: 'f-pb', hint: 'Antes de cargarlo acá.' })}
          ${moneyField('installmentAmount', 'Valor de cuota (opcional)', l.installmentAmount)}
          ${selectField('frequency', 'Frecuencia', opts(['mensual', 'quincenal', 'semanal', 'bimestral', 'trimestral', 'unico', 'ninguna'].map((f) => [f, Engine.FREQ[f].label]), l.frequency), l.frequency)}
          ${dateField('nextDueDate', 'Próximo vencimiento', l.nextDueDate, { hint: 'Sin fecha no se proyectan cuotas.' })}
          ${fld('Tasa nominal anual % (opcional)', `<input class="input" inputmode="decimal" name="rate" id="f-rate" value="${l.rate ? String(l.rate).replace('.', ',') : ''}" placeholder="Ej.: 72">`, { id: 'f-rate', hint: 'Para sugerir el interés de cada pago.' })}
        </div>
        ${fld('Cuenta habitual de pago', `<select class="input" name="accountId" id="f-acc">${accountOpts(l.accountId)}</select>`, { id: 'f-acc' })}
        ${fld('Observaciones', `<textarea class="input" name="notes" id="f-notes" maxlength="400">${esc(l.notes || '')}</textarea>`, { id: 'f-notes' })}
        ${!existing ? `<label class="check"><input type="checkbox" name="disbursed"><span>Recibí el dinero hoy en una cuenta<br><span class="small muted">Suma el importe a esa cuenta. No cuenta como ingreso: es deuda.</span></span></label>` : ''}
        <p class="callout warn" data-show="warn"></p>
      </div>`,
      onInput: (form) => {
        const inst = parseInt(form.elements.installments.value, 10); const q = Money.parse(form.elements.installmentAmount.value); const bal = Money.parse(form.elements.initialBalance.value);
        const pb = parseInt(form.elements.paidBefore.value, 10) || 0;
        const w = $('[data-show="warn"]', form);
        if (inst > 0 && q > 0 && bal > 0 && (inst - pb) * q > bal && !(parseFloat(form.elements.rate.value.replace(',', '.')) > 0)) {
          w.innerHTML = `Las ${inst - pb} cuotas restantes suman ${esc(fmt((inst - pb) * q))}, más que el saldo (${esc(fmt(bal))}). La diferencia (${esc(fmt((inst - pb) * q - bal))}) parece interés: al registrar cada pago se va a sugerir esa proporción como interés.`;
          w.hidden = false;
        } else w.hidden = true;
      },
      danger: existing ? { label: 'Eliminar', onClick: () => {
        if (hasPays) { if (!confirm('Este préstamo tiene pagos registrados. Se va a archivar y los pagos quedan en Movimientos. ¿Continuar?')) return false; commit((s) => { s.loans.find((x) => x.id === l.id).archived = true; }, 'Préstamo archivado', { undo: true }); return; }
        commit((s) => { s.loans = s.loans.filter((x) => x.id !== l.id); }, 'Préstamo eliminado', { undo: true });
      } } : null,
      onSubmit: (form, d) => {
        const errs = {};
        if (!d.creditor) errs.creditor = 'Indicá a quién le debés.';
        const initialBalance = d.initialBalance ? parseMoneyReq(d.initialBalance, errs, 'initialBalance') : null;
        if (initialBalance == null && !d.installmentAmount) errs.initialBalance = 'Cargá el saldo pendiente o, al menos, el valor de la cuota.';
        let originalAmount = parseMoneyOpt(d.originalAmount, errs, 'originalAmount');
        const installmentAmount = parseMoneyOpt(d.installmentAmount, errs, 'installmentAmount');
        const installments = d.installments ? parseInt(d.installments, 10) : null;
        const paidBefore = d.paidBefore ? parseInt(d.paidBefore, 10) : 0;
        if (installments != null && !(installments >= 1)) errs.installments = 'Número de cuotas inválido.';
        if (installments && paidBefore >= installments) errs.paidBefore = 'Las cuotas pagadas deben ser menos que el total.';
        if (paidBefore < 0) errs.paidBefore = 'No puede ser negativo.';
        if (d.nextDueDate && !D.valid(d.nextDueDate)) errs.nextDueDate = 'Fecha inválida.';
        const rate = d.rate ? parseFloat(d.rate.replace(',', '.')) : null;
        if (d.rate && !(rate >= 0 && rate < 1000)) errs.rate = 'Tasa inválida.';
        if (originalAmount != null && initialBalance != null && initialBalance > 0 && originalAmount < initialBalance && !errs.originalAmount) errs.originalAmount = 'El importe original no puede ser menor al saldo pendiente.';
        if (Object.keys(errs).length) return errs;
        if (originalAmount == null && initialBalance != null) originalAmount = initialBalance;
        const data = { creditor: d.creditor, creditorType: d.creditorType, originalAmount, initialBalance, installments, paidBefore, installmentAmount, frequency: d.frequency, nextDueDate: d.nextDueDate || null, rate, accountId: d.accountId, notes: d.notes, categoryId: catFor[d.creditorType] };
        if (existing) commit((s) => Object.assign(s.loans.find((x) => x.id === l.id), data), 'Préstamo actualizado', { undo: true });
        else commit((s) => {
          const id = Store.uid();
          s.loans.push({ id, ...data, createdDate: today, archived: false });
          if (d.disbursed && initialBalance) s.txs.push({ id: Store.uid(), createdAt: Date.now(), kind: 'prestamo_recibido', loanId: id, amount: initialBalance, date: today, accountId: d.accountId, status: 'pagado', description: `Préstamo de ${d.creditor}` });
        }, 'Préstamo registrado');
      },
    });
  }

  function loanPaymentForm(loanId, existing = null) {
    const l = loan(loanId); if (!l) return;
    const others = existing ? state.txs.filter((t) => t.id !== existing.id) : state.txs;
    const ls = Engine.loanState(l, others, today);
    const defType = existing?.paymentType || (l.installmentAmount ? 'cuota' : 'parcial');
    const defAmount = existing ? existing.amount : (defType === 'cuota' ? (ls.next?.amount || l.installmentAmount) : null);
    const body = `<div class="form-grid">
      <div class="callout">Saldo pendiente: <b>${ls.balanceKnown ? esc(fmt(ls.balance)) : 'sin informar'}</b>${ls.next ? `. Próxima cuota: ${esc(fmt(ls.next.amount))} el ${dl(ls.next.date)}${ls.next.date < today ? ' (vencida)' : ''}` : ''}.</div>
      ${segField('paymentType', 'Tipo de pago', [['cuota', 'Cuota'], ['parcial', 'Parcial'], ['extraordinario', 'Extra'], ...(ls.balanceKnown ? [['cancelacion', 'Cancelación']] : [])], defType)}
      ${moneyField('amount', 'Importe pagado', defAmount, { big: true })}
      ${moneyField('interest', 'Interés incluido en el pago', existing ? existing.interest : null, { hint: 'Ajustalo al de tu comprobante.' })}
      <p class="callout info" data-show="split"></p>
      <div class="form-grid two">${dateField('date', 'Fecha de pago', existing ? existing.date : today)}${fld('Pagado desde', `<select class="input" name="accountId" id="f-acc">${accountOpts(existing?.accountId || l.accountId)}</select>`, { id: 'f-acc' })}</div>
    </div>`;
    let lastType = existing ? defType : null; let touchedInterest = !!existing;
    openModal({
      title: existing ? 'Editar pago de préstamo' : `Pagar a ${l.creditor}`, body,
      submit: existing ? 'Guardar cambios' : 'Registrar pago',
      danger: existing ? { label: 'Eliminar', onClick: () => deleteTx(existing.id) } : null,
      onInput: (form) => {
        const ty = form.elements.paymentType.value;
        const fA = form.elements.amount, fI = form.elements.interest;
        if (ty !== lastType) {
          if (ty === 'cuota' && (ls.next?.amount || l.installmentAmount)) fA.value = moneyInput(ls.next?.amount || l.installmentAmount);
          lastType = ty; if (!existing) touchedInterest = false;
        }
        let amount = Money.parse(fA.value);
        if (!touchedInterest && (amount > 0 || ty === 'cancelacion')) {
          const base = ty === 'cancelacion' ? ls.balance * 2 : amount; // en cancelación el tope lo da el saldo
          const sug = Engine.suggestInterest(l, ls.balance, base, ls);
          const i = (ty === 'cuota' || l.rate > 0) ? sug.interest : 0;
          fI.value = i ? moneyInput(i) : '';
          const hintEl = fI.closest('.field').querySelector('.hint');
          if (hintEl) hintEl.textContent = sug.basis === 'rate' ? `Sugerido con la tasa (${String(l.rate).replace('.', ',')}% anual sobre el saldo). Ajustalo al de tu comprobante.` : sug.basis === 'implicit' && ty === 'cuota' ? 'Sugerido por la diferencia entre cuotas restantes y saldo. Ajustalo al de tu comprobante.' : 'Sin tasa cargada: si el pago incluye interés, indicalo. Si no, queda todo como capital.';
        }
        if (ty === 'cancelacion') { amount = ls.balance + (Money.parse(fI.value) || 0); fA.value = moneyInput(amount); }
        const interest = Money.parse(fI.value) || 0;
        const cap = (amount || 0) - interest;
        $('[data-show="split"]', form).innerHTML = amount > 0 ? `Capital: <b>${esc(fmt(cap))}</b> reduce la deuda${ls.balanceKnown ? ` (queda ${esc(fmt(ls.balance - cap))})` : ''}. Interés: <b>${esc(fmt(interest))}</b> cuenta como gasto. Tu disponible baja ${esc(fmt(amount))}.` : 'Ingresá el importe del pago.';
      },
      onSubmit: (form, d) => {
        const errs = {}; const amount = parseMoneyReq(d.amount, errs, 'amount');
        const interest = d.interest ? parseMoneyReq(d.interest, errs, 'interest', { allowZero: true }) : 0;
        if (!errs.amount && !errs.interest && interest > amount) errs.interest = 'El interés no puede superar el pago.';
        if (ls.balanceKnown && !errs.amount && !errs.interest && amount - interest > ls.balance) errs.amount = `El capital (${fmt(amount - interest)}) supera el saldo pendiente (${fmt(ls.balance)}). Revisá el importe o el interés.`;
        if (!D.valid(d.date)) errs.date = 'Fecha inválida.'; else if (d.date > today) errs.date = 'La fecha no puede ser futura.';
        if (Object.keys(errs).length) return errs;
        const tx = { kind: 'pago_prestamo', loanId: l.id, paymentType: d.paymentType, amount, interest, date: d.date, accountId: d.accountId, status: 'pagado', categoryId: l.categoryId, description: `${{ cuota: 'Cuota', parcial: 'Pago parcial', extraordinario: 'Pago extraordinario', cancelacion: 'Cancelación' }[d.paymentType]} ${l.creditor}` };
        const closes = ls.balanceKnown && amount - interest === ls.balance;
        if (existing) commit((s) => Object.assign(s.txs.find((x) => x.id === existing.id), tx), 'Pago actualizado', { undo: true });
        else commit((s) => s.txs.push({ id: Store.uid(), createdAt: Date.now(), ...tx }), closes ? `¡Deuda con ${l.creditor} cancelada!` : 'Pago registrado', { undo: true });
      },
    });
    $('#modal form').elements.interest.addEventListener('input', () => { touchedInterest = true; });
  }

        ${selectField('cls', 'Clasificación', opts([['esencial', 'Esencial: no se puede dejar de pagar'], ['ajustable', 'Ajustable: se puede reducir'], ['discrecional', 'Discrecional: se puede evitar']], c.cls), c.cls)}
        ${existing && usedCount ? `<div class="field"><label for="f-repl">Si la eliminás, pasar sus ${usedCount} registros a</label><select class="input" id="f-repl" name="replacement">${sameKind.map((x) => `<option value="${x.id}">${esc(x.name)}</option>`).join('')}</select></div>` : ''}</div>`,
      danger: existing ? { label: 'Eliminar', onClick: () => {
        const repl = $('#modal form').elements.replacement?.value;
        if (usedCount && !repl) { toast('Necesitás otra categoría del mismo tipo para reasignar.', { error: true }); return false; }

          for (const t of s.txs) if (t.categoryId === c.id) t.categoryId = repl;
          for (const r of s.recurrings) if (r.categoryId === c.id) r.categoryId = repl;
          for (const l of s.loans) if (l.categoryId === c.id) l.categoryId = repl;
          s.categories = s.categories.filter((x) => x.id !== c.id);
        }, 'Categoría eliminada', { undo: true });
      } } : null,
      onSubmit: (form, d) => {
        const errs = {};
        if (!d.name) errs.name = 'Poné un nombre.';

        if (state.categories.some((x) => x.name.toLowerCase() === d.name.toLowerCase() && x.group === d.group && x.id !== c.id)) errs.name = 'Ya existe una categoría con ese nombre en el grupo.';
        if (existing && usedCount && kind !== c.kind) errs.group = 'Tiene movimientos: elegí un grupo del mismo tipo.';
        if (Object.keys(errs).length) return errs;
        if (existing) commit((s) => Object.assign(s.categories.find((x) => x.id === c.id), { name: d.name, group: d.group, kind, cls: d.cls }), 'Categoría actualizada');
        else commit((s) => s.categories.push({ id: 'cat-' + Store.uid(), name: d.name, group: d.group, kind, cls: d.cls }), 'Categoría creada');

  /* ======================= RESPALDO ======================= */
  function download(name, content, type) {
    const blob = new Blob([content], { type });
    const a = document.createElement('a'); a.href = URL.createObjectURL(blob); a.download = name;
    document.body.appendChild(a); a.click(); setTimeout(() => { URL.revokeObjectURL(a.href); a.remove(); }, 500);
  }
  function exportJSON() {
    state.settings.lastBackupAt = new Date().toISOString();
    persist();
    download(`mis-finanzas-${Store.profile === 'demo' ? 'DEMO-' : ''}respaldo-${today}.json`, JSON.stringify(Store.makeBackup(state), null, 1), 'application/json');
    toast('Respaldo descargado. Guardalo en un lugar seguro.');
    render();
  }
  function exportCSV(all) {
    const list = all ? state.txs : filteredTxs();
    if (!list.length) { toast('No hay movimientos para exportar.', { error: true }); return; }
    download(`movimientos-${all ? 'todos' : ui.filters.period}-${today}.csv`, Store.toCSV(state, list), 'text/csv;charset=utf-8');
    toast(`${list.length} movimientos exportados`);
  }
  function importJSON(file) {
    const reader = new FileReader();
    reader.onload = () => {
      let obj; try { obj = JSON.parse(reader.result); } catch { toast('El archivo no es un JSON válido.', { error: true }); return; }
      const v = Store.validateBackup(obj);
      if (!v.ok) { openModal({ title: 'No se puede importar', submit: null, body: `<div class="callout warn">${v.errors.map(esc).join('<br>')}</div>` }); return; }
      const dd = obj.data;
      const fromDemo = obj.profile === 'demo' && Store.profile === 'real';
      openModal({
        title: 'Importar respaldo', submit: 'Reemplazar datos',
        body: `<div class="form-grid"><p>Respaldo del <b>${esc(new Date(obj.exportedAt).toLocaleString('es-AR'))}</b>: ${dd.txs.length} movimientos, ${dd.accounts.length} cuentas, ${dd.cards.length} tarjetas, ${dd.loans.length} préstamos, ${dd.recurrings.length} recurrentes.</p>
          ${fromDemo ? '<div class="callout warn">Este respaldo contiene <b>datos de demostración</b> y estás en “Mis datos”. Si continuás, tus datos reales se reemplazan por datos ficticios.</div>' : ''}
          <div class="callout warn">Se reemplazan todos los datos actuales del perfil ${Store.profile === 'demo' ? 'de demostración' : '“Mis datos”'} (${state.txs.length} movimientos). Si no tenés copia, exportá un respaldo antes.</div>
          ${fromDemo ? '<label class="check"><input type="checkbox" name="confirmDemo"><span>Entiendo que reemplazo mis datos reales por datos de ejemplo.</span></label>' : ''}</div>`,
        extraFoot: `<button type="button" class="btn" data-pre-export>${icon('download')}Respaldar actuales</button>`,
        onSubmit: (form, d) => {
          if (fromDemo && !d.confirmDemo) return { confirmDemo: 'Confirmá para continuar.' };
          const snap = JSON.stringify(state);
          state = Store.migrate(JSON.parse(JSON.stringify(dd)));
          Engine.materializeRecurring(state, today, Store.uid);
          persist(); render();
          toast('Respaldo importado', { undo: () => { state = JSON.parse(snap); persist(); render(); } });
        },
      });
      $('#modal [data-pre-export]').onclick = exportJSON;
    };
    reader.readAsText(file);
  }

  /* ======================= PERFILES ======================= */
  /** Datos iniciales embebidos en la página (solo en la versión personal; nunca en la publicada). */
  function readSeed() {
    const el = document.getElementById('seed-data');
    if (!el) return null;
    try { const obj = JSON.parse(el.textContent); return Store.validateBackup(obj).ok ? obj : null; } catch { return null; }
  }
  function startProfile(p, { fresh = false } = {}) {
    let s = fresh ? null : Store.load(p);
    if (!s) {
      Store.load(p);
      const seed = p === 'real' && !fresh ? readSeed() : null;
      s = p === 'demo' ? Store.demoState(today) : seed ? Store.migrate(JSON.parse(JSON.stringify(seed.data))) : Store.emptyState();
    }
    state = s;
    Engine.materializeRecurring(state, today, Store.uid);
    persist();
    Store.writeMeta({ ...Store.readMeta(), active: p });
    applyTheme();
    ui.filters.period = D.period(today);
    render();
  }
  function applyTheme() { const t = state?.settings.theme; if (t) document.documentElement.dataset.theme = t; else delete document.documentElement.dataset.theme; }

  /* ======================= EVENTOS ======================= */
  const ACTIONS = {
    'new-tx': (el) => txForm(null, { card: el.dataset.card }),
    'edit-tx': (el) => txForm(state.txs.find((t) => t.id === el.dataset.id)),
    'pay-tx': (el) => payTxForm(el.dataset.id),
    'pay-card': (el) => cardPaymentForm(el.dataset.id),
    'pay-loan': (el) => loanPaymentForm(el.dataset.id),
    'statement': (el) => statementForm(el.dataset.id),
    'new-rec': () => recForm(), 'edit-rec': (el) => recForm(state.recurrings.find((r) => r.id === el.dataset.id)),
    'new-card': () => cardForm(), 'edit-card': (el) => cardForm(card(el.dataset.id)),
    'new-loan': () => loanForm(), 'edit-loan': (el) => loanForm(loan(el.dataset.id)),
    'add-account': () => accountForm(), 'edit-account': (el) => accountForm(acc(el.dataset.id)),
    'new-cat': () => catForm(), 'edit-cat': (el) => catForm(cat(el.dataset.id)),
    'new-extra': () => extraForm(), 'edit-extra': (el) => extraForm(state.settings.projection.extras.find((x) => x.id === el.dataset.id)),
    'mov-tab': (el) => { ui.movTab = el.dataset.tab; render(); },
    'debt-tab': (el) => { ui.debtTab = el.dataset.tab; render(); },
    'mov-month': (el) => { ui.filters.period = D.addPeriod(ui.filters.period, +el.dataset.d); render(); },
    'proj-months': (el) => { ui.projMonths = +el.dataset.n; render(); },
    'proj-open': (el) => { ui.openProj = ui.openProj === el.dataset.p ? null : el.dataset.p; render(); },
    'use-suggest': (el) => commit((s) => { s.settings.projection.variableMonthly = +el.dataset.v; }, 'Estimación actualizada'),
    'clear-override': (el) => commit((s) => { delete s.settings.projection.overrides[el.dataset.p]; }, 'Se usa el valor general'),
    'export-json': exportJSON, 'export-csv': () => exportCSV(false), 'export-csv-all': () => exportCSV(true),
    'import-json': () => $('#import-file').click(),
    'toggle-hide': () => commit((s) => { s.settings.hideAmounts = !s.settings.hideAmounts; }),
    'start-real': () => startProfile('real'), 'start-demo': () => startProfile('demo'),
    'start-import': () => { startProfile('real'); go('config'); setTimeout(() => $('#import-file').click(), 50); },
    'switch-profile': (el) => { startProfile(el.dataset.p); go('inicio'); toast(el.dataset.p === 'demo' ? 'Modo demostración: datos ficticios' : 'Estás en tus datos'); },
    'reset-demo': () => { if (confirm('¿Regenerar los datos de ejemplo? Se pierden los cambios hechos en la demo.')) { Store.clear('demo'); startProfile('demo', { fresh: true }); toast('Datos de ejemplo regenerados'); } },
    'wipe': () => {
      openModal({
        title: 'Borrar datos de este perfil', submit: 'Borrar definitivamente',
        body: `<div class="form-grid"><div class="callout warn">Se eliminan ${state.txs.length} movimientos, cuentas, tarjetas, préstamos y recurrentes del perfil ${Store.profile === 'demo' ? 'de demostración' : '“Mis datos”'}. No se puede deshacer.</div>${textField('confirm', 'Escribí BORRAR para confirmar', '', { autofocus: true })}</div>`,
        extraFoot: `<button type="button" class="btn" data-pre-export>${icon('download')}Respaldar antes</button>`,
        onSubmit: (form, d) => {
          if (d.confirm !== 'BORRAR') return { confirm: 'Escribí BORRAR en mayúsculas.' };
          const p = Store.profile; Store.clear(p); startProfile(p, { fresh: true }); go('inicio'); toast('Datos borrados');
        },
      });
      $('#modal [data-pre-export]').onclick = exportJSON;
    },
  };

  function onClick(e) {
    const el = e.target.closest('[data-action]');
    if (!el || el.tagName === 'SELECT' || el.tagName === 'INPUT') return; // selects y checkboxes van por "change"
    const fn = ACTIONS[el.dataset.action];
    if (fn) { e.preventDefault(); if (!state && !el.dataset.action.startsWith('start-')) return; fn(el); }
  }
  function onChange(e) {
    const el = e.target;
    if (el.dataset.filter) { ui.filters[el.dataset.filter] = el.value; if (el.dataset.filter !== 'q') render(); return; }
    if (el.dataset.action === 'cat-cls') { commit((s) => { s.categories.find((c) => c.id === el.dataset.id).cls = el.value; }, 'Clasificación actualizada'); return; }
    if (el.dataset.action === 'toggle-hide') { ACTIONS['toggle-hide'](); return; }
    if (el.dataset.action === 'theme') { commit((s) => { s.settings.theme = el.value || null; }); applyTheme(); return; }
    if (el.id === 'import-file' && el.files[0]) { importJSON(el.files[0]); el.value = ''; }
  }
  let qTimer;
  function onInput(e) {
    const el = e.target;
    if (el.dataset.filter === 'q') {
      ui.filters.q = el.value; clearTimeout(qTimer);
      qTimer = setTimeout(() => { const pos = el.selectionStart; render(); const n = $('[data-filter="q"]'); if (n) { n.focus(); n.setSelectionRange(pos, pos); } }, 180);
    }
  }
  function onSubmit(e) {
    const f = e.target.closest('form[data-form]');
    if (!f) return;
    e.preventDefault();
    const v = f.elements.v.value.trim();
    if (f.dataset.form === 'variable') {
      const c = v ? Money.parse(v) : 0;
      if (Number.isNaN(c) || c < 0) { toast('Importe inválido', { error: true }); return; }
      commit((s) => { s.settings.projection.variableMonthly = c; }, 'Estimación actualizada');
    }
    if (f.dataset.form === 'override') {
      if (!v) { commit((s) => { delete s.settings.projection.overrides[f.dataset.p]; }); return; }
      const c = Money.parse(v);
      if (Number.isNaN(c) || c < 0) { toast('Importe inválido', { error: true }); return; }
      commit((s) => { s.settings.projection.overrides[f.dataset.p] = c; }, `Estimación de ${Engine.periodLabel(f.dataset.p)} actualizada`);
    }
  }
  function onKey(e) {
    if (e.key.toLowerCase() !== 'n' || e.ctrlKey || e.metaKey || e.altKey) return;
    if ($('#modal').open || /INPUT|SELECT|TEXTAREA/.test(document.activeElement?.tagName)) return;
    if (state) { e.preventDefault(); txForm(); }
  }
  function onRoute() {
    const r = (location.hash || '#inicio').slice(1);
    ui.route = ROUTES.some((x) => x.id === r) ? r : 'inicio';
    render();
    window.scrollTo(0, 0);
  }

  function init() {
    if (!Store.storageAvailable()) {
      $('#main').innerHTML = `<div class="welcome">${emptyBox('alert', 'No se puede guardar en este navegador', 'El almacenamiento local está bloqueado (modo privado o configuración). Abrí el archivo en una ventana normal para que tus datos se conserven.')}</div>`;
      return;
    }
    document.addEventListener('click', onClick);
    document.addEventListener('change', onChange);
    document.addEventListener('input', onInput);
    document.addEventListener('submit', onSubmit);
    document.addEventListener('keydown', onKey);
    window.addEventListener('hashchange', onRoute);
    // al volver a la pestaña otro día, refrescar fechas y recurrencias
    document.addEventListener('visibilitychange', () => { if (!document.hidden && state && D.today() !== today) { today = D.today(); commit(() => {}); } });
    const r = (location.hash || '#inicio').slice(1); ui.route = ROUTES.some((x) => x.id === r) ? r : 'inicio';
    const meta = Store.readMeta();
    if (meta.active && Store.has(meta.active)) startProfile(meta.active); else render();
  }

  return { init, _debug: { get state() { return state; }, ui } };
})();
document.addEventListener('DOMContentLoaded', App.init);

</script>

<script>
/* Funciona sin conexión cuando se publica (GitHub Pages). En file:// no aplica. */
if ('serviceWorker' in navigator && /^https?:$/.test(location.protocol)) {
  window.addEventListener('load', () => navigator.serviceWorker.register('sw.js').catch(() => {}));
}
</script>
</body>
</html>
