<!DOCTYPE html>
<html lang="es-AR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#13243A">
<meta name="description" content="Administración financiera personal: saldo disponible, vencimientos, deudas, tarjetas y proyección mensual. Funciona sin conexión.">
<title>Mis Finanzas</title>
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Mis Finanzas">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='8' fill='%2313243A'/%3E%3Cpath d='M8 21l5-6 4 3 7-8' stroke='%23fff' stroke-width='2.6' fill='none' stroke-linecap='round' stroke-linejoin='round'/%3E%3C/svg%3E">
<style>
/* =====================================================================
   Sistema visual — Mis Finanzas
   Tinta azul marino sobre papel frío; verde y rojo reservados para
   resultado positivo / déficit. Números tabulares en todo importe.
   ===================================================================== */
:root {
  color-scheme: light;
  --bg: #F2F4F6; --surface: #FFFFFF; --surface-2: #F7F8FA; --sunken: #EBEEF2;
  --ink: #13243A; --ink-2: #3E4F63; --muted: #66758A; --line: #DFE4EA; --line-2: #CBD3DC;
  --accent: #2B5B8A; --accent-ink: #FFFFFF; --accent-soft: #E6EEF7;
  --pos: #137A3A; --pos-soft: #E4F3EA; --neg: #B3261E; --neg-soft: #FBE9E7; --warn: #8F5600; --warn-soft: #FCF1DE;
  --s1: #2a78d6; --s2: #eb6834; --s3: #1baf7a;
  --radius: 14px; --radius-s: 9px;
  --shadow: 0 1px 2px rgba(19,36,58,.06), 0 1px 1px rgba(19,36,58,.03);
  --font: "Segoe UI Variable Text", "Segoe UI", system-ui, -apple-system, "SF Pro Text", Roboto, "Helvetica Neue", Arial, sans-serif;
  --font-num: "Segoe UI Variable Display", "Segoe UI", system-ui, -apple-system, "SF Pro Display", Roboto, sans-serif;
  --nav-h: 64px;
}
@media (prefers-color-scheme: dark) {
  :root:where(:not([data-theme="light"])) {
    color-scheme: dark;
    --bg: #0E151D; --surface: #16202B; --surface-2: #1B2734; --sunken: #111A23;
    --ink: #E9EEF3; --ink-2: #BAC6D2; --muted: #8C9AAA; --line: #263342; --line-2: #34465A;
    --accent: #86B0DB; --accent-ink: #0E151D; --accent-soft: #1D3046;
    --pos: #5BC787; --pos-soft: #13301F; --neg: #F08076; --neg-soft: #3A1A18; --warn: #E6AE58; --warn-soft: #33260F;
    --s1: #3987e5; --s2: #d95926; --s3: #199e70;
    --shadow: none;
  }
}
:root[data-theme="dark"] {
  color-scheme: dark;
  --bg: #0E151D; --surface: #16202B; --surface-2: #1B2734; --sunken: #111A23;
  --ink: #E9EEF3; --ink-2: #BAC6D2; --muted: #8C9AAA; --line: #263342; --line-2: #34465A;
  --accent: #86B0DB; --accent-ink: #0E151D; --accent-soft: #1D3046;
  --pos: #5BC787; --pos-soft: #13301F; --neg: #F08076; --neg-soft: #3A1A18; --warn: #E6AE58; --warn-soft: #33260F;
  --s1: #3987e5; --s2: #d95926; --s3: #199e70;
  --shadow: none;
}
*, *::before, *::after { box-sizing: border-box; }
html { -webkit-text-size-adjust: 100%; }
body { margin: 0; background: var(--bg); color: var(--ink); font: 15px/1.5 var(--font); -webkit-font-smoothing: antialiased; }
button, input, select, textarea { font: inherit; color: inherit; }
a { color: var(--accent); }
h1, h2, h3, h4 { margin: 0; line-height: 1.25; font-weight: 650; }
h1 { font-size: 1.5rem; letter-spacing: -.01em; }
h2 { font-size: 1.05rem; }
h3 { font-size: .95rem; }
p { margin: 0; }
.num, .amt { font-family: var(--font-num); font-variant-numeric: tabular-nums; white-space: nowrap; }
.muted { color: var(--muted); }
.small { font-size: .84rem; }
.xs { font-size: .76rem; }
.pos { color: var(--pos); } .neg { color: var(--neg); } .warn { color: var(--warn); }
.sr-only { position: absolute; width: 1px; height: 1px; padding: 0; margin: -1px; overflow: hidden; clip: rect(0,0,0,0); white-space: nowrap; border: 0; }
:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; border-radius: 6px; }
body.hide-amounts .amt { filter: blur(7px); user-select: none; }
@media (prefers-reduced-motion: reduce) { * { animation: none !important; transition: none !important; } }

/* ---------- Estructura ---------- */
.app { min-height: 100vh; }
.rail { display: none; }
.topbar { position: sticky; top: 0; z-index: 20; display: flex; align-items: center; gap: 10px; padding: 12px 16px; padding-top: max(12px, env(safe-area-inset-top)); background: color-mix(in srgb, var(--bg) 88%, transparent); backdrop-filter: blur(10px); }
.brand { display: flex; align-items: center; gap: 10px; font-weight: 700; letter-spacing: -.01em; }
.brand-mark { width: 28px; height: 28px; border-radius: 8px; background: var(--ink); display: grid; place-items: center; }
.brand-mark svg.i { width: 18px; height: 18px; stroke: var(--bg); stroke-width: 2.4; }
.topbar .spacer { flex: 1; }
main { padding: 4px 16px calc(var(--nav-h) + 96px); max-width: 1120px; margin: 0 auto; min-width: 0; }
.app > div { min-width: 0; }
.tabbar { position: fixed; z-index: 30; left: 0; right: 0; bottom: 0; display: grid; grid-template-columns: repeat(5, 1fr); background: var(--surface); border-top: 1px solid var(--line); padding-bottom: env(safe-area-inset-bottom); }
.tabbar a { display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 2px; height: var(--nav-h); text-decoration: none; color: var(--muted); font-size: .7rem; font-weight: 550; }
.tabbar a svg { width: 22px; height: 22px; }
.tabbar a[aria-current="page"] { color: var(--ink); }
.tabbar a[aria-current="page"] svg { stroke-width: 2.2; }
.fab { position: fixed; z-index: 31; right: 16px; bottom: calc(var(--nav-h) + 16px + env(safe-area-inset-bottom)); height: 54px; padding: 0 20px 0 16px; border-radius: 27px; border: 0; background: var(--ink); color: var(--bg); display: flex; align-items: center; gap: 8px; font-weight: 650; box-shadow: 0 6px 18px rgba(19,36,58,.28); cursor: pointer; }
.fab svg { width: 22px; height: 22px; stroke: currentColor; }
@media (min-width: 920px) {
  .app { display: grid; grid-template-columns: 236px 1fr; }
  .rail { display: flex; flex-direction: column; gap: 4px; position: sticky; top: 0; height: 100vh; padding: 22px 14px; border-right: 1px solid var(--line); background: var(--surface); }
  .rail .brand { padding: 0 10px 20px; font-size: 1.05rem; }
  .rail nav { display: flex; flex-direction: column; gap: 2px; }
  .rail nav a { display: flex; align-items: center; gap: 12px; padding: 10px 12px; border-radius: 10px; color: var(--ink-2); text-decoration: none; font-weight: 550; }
  .rail nav a svg { width: 20px; height: 20px; }
  .rail nav a:hover { background: var(--surface-2); }
  .rail nav a[aria-current="page"] { background: var(--accent-soft); color: var(--ink); }
  .rail .btn-add { margin: 18px 4px 0; }
  .rail .rail-foot { margin-top: auto; padding: 0 10px; }
  .topbar, .tabbar, .fab { display: none; }
  main { padding: 28px 36px 60px; width: 100%; }
}

/* ---------- Componentes ---------- */
.page-head { display: flex; align-items: flex-end; justify-content: space-between; gap: 12px; flex-wrap: wrap; margin: 6px 0 18px; }
.page-head .sub { color: var(--muted); font-size: .9rem; margin-top: 2px; }
.card { background: var(--surface); border: 1px solid var(--line); border-radius: var(--radius); padding: 18px; box-shadow: var(--shadow); }
.card + .card { margin-top: 14px; }
.card-head { display: flex; align-items: center; justify-content: space-between; gap: 10px; margin-bottom: 12px; }
.card-head h2 { display: flex; align-items: center; gap: 8px; }
.grid { display: grid; gap: 14px; grid-template-columns: minmax(0, 1fr); }
.grid > .card + .card { margin-top: 0; }
@media (min-width: 640px) { .grid-2, .grid-4 { grid-template-columns: repeat(2, minmax(0, 1fr)); } }
@media (min-width: 1100px) { .grid-4 { grid-template-columns: repeat(4, minmax(0, 1fr)); } }
.stack { display: flex; flex-direction: column; gap: 14px; }
.row { display: flex; align-items: center; gap: 10px; }
.row.wrap { flex-wrap: wrap; }
.between { justify-content: space-between; }
.mt { margin-top: 14px; } .mt-s { margin-top: 8px; } .mb { margin-bottom: 14px; }

.btn { display: inline-flex; align-items: center; justify-content: center; gap: 7px; height: 40px; padding: 0 15px; border-radius: 10px; border: 1px solid var(--line-2); background: var(--surface); color: var(--ink); font-weight: 600; font-size: .9rem; cursor: pointer; white-space: nowrap; text-decoration: none; }
.btn svg { width: 18px; height: 18px; flex: none; }
.btn:hover { background: var(--surface-2); }
.btn-primary { background: var(--ink); border-color: var(--ink); color: var(--bg); }
.btn-primary:hover { background: var(--ink-2); }
.btn-accent { background: var(--accent); border-color: var(--accent); color: var(--accent-ink); }
.btn-accent:hover { background: color-mix(in srgb, var(--accent) 86%, var(--ink)); }
.btn-ghost { border-color: transparent; background: transparent; }
.btn-ghost:hover { background: var(--sunken); }
.btn-danger { color: var(--neg); border-color: color-mix(in srgb, var(--neg) 35%, var(--line)); }
.btn-s { height: 32px; padding: 0 11px; font-size: .82rem; border-radius: 8px; }
.btn-icon { width: 38px; padding: 0; }
.btn-block { width: 100%; }
.btn:disabled { opacity: .5; cursor: not-allowed; }

.pill { display: inline-flex; align-items: center; gap: 4px; height: 22px; padding: 0 8px; border-radius: 11px; font-size: .74rem; font-weight: 650; background: var(--sunken); color: var(--ink-2); white-space: nowrap; }
.pill svg { width: 12px; height: 12px; }
.pill-neg { background: var(--neg-soft); color: var(--neg); }
.pill-pos { background: var(--pos-soft); color: var(--pos); }
.pill-warn { background: var(--warn-soft); color: var(--warn); }
.pill-accent { background: var(--accent-soft); color: var(--accent); }
:root[data-theme="dark"] .pill-accent { color: var(--ink); }

.seg { display: inline-flex; background: var(--sunken); border-radius: 10px; padding: 3px; gap: 2px; }
.seg button, .seg label { border: 0; background: transparent; height: 32px; padding: 0 14px; border-radius: 8px; font-weight: 600; font-size: .86rem; color: var(--muted); cursor: pointer; display: inline-flex; align-items: center; }
.seg [aria-pressed="true"], .seg [aria-selected="true"], .seg input:checked + span { background: var(--surface); color: var(--ink); box-shadow: var(--shadow); }
.seg label { padding: 0; }
.seg label span { display: inline-flex; align-items: center; height: 32px; padding: 0 14px; border-radius: 8px; }
.seg input { position: absolute; opacity: 0; pointer-events: none; }
.seg label:has(input:focus-visible) span { outline: 2px solid var(--accent); }

.banner { display: flex; align-items: flex-start; gap: 10px; padding: 12px 14px; border-radius: 12px; margin-bottom: 14px; font-size: .9rem; background: var(--accent-soft); color: var(--ink); }
.banner svg { width: 20px; height: 20px; flex: none; margin-top: 1px; }
.banner .grow { flex: 1; }
.banner-warn { background: var(--warn-soft); }
.banner-warn svg { stroke: var(--warn); }
.banner-neg { background: var(--neg-soft); }
.banner-neg svg { stroke: var(--neg); }
.banner .btn { height: 32px; font-size: .82rem; }

/* ---------- Hero: ecuación del mes ---------- */
.hero { padding: 22px; border-radius: 18px; background: var(--surface); border: 1px solid var(--line); position: relative; overflow: hidden; }
.hero::before { content: ""; position: absolute; inset: 0 0 auto 0; height: 4px; background: var(--tone, var(--accent)); }
.hero.is-pos { --tone: var(--pos); } .hero.is-neg { --tone: var(--neg); }
.hero-label { font-weight: 600; color: var(--ink-2); }
.hero-value { font-family: var(--font-num); font-variant-numeric: tabular-nums; font-size: clamp(2.3rem, 9vw, 3.4rem); font-weight: 700; letter-spacing: -.025em; line-height: 1.05; color: var(--tone); margin: 4px 0 2px; }
.equation { display: grid; grid-template-columns: 1fr; gap: 0; margin-top: 18px; border-top: 1px dashed var(--line-2); }
.eq-term { display: flex; justify-content: space-between; align-items: baseline; gap: 12px; padding: 9px 0; border-bottom: 1px dashed var(--line); }
.eq-term .op { display: inline-grid; place-items: center; width: 22px; height: 22px; margin-right: 8px; border-radius: 6px; background: var(--sunken); font-weight: 700; color: var(--ink-2); font-family: var(--font-num); }
.eq-term .lbl { display: flex; align-items: center; color: var(--ink-2); font-size: .92rem; }
.eq-term .amt { font-weight: 650; font-size: 1.02rem; }
.eq-term.total { border-bottom: 0; padding-top: 11px; }
.eq-term.total .lbl { color: var(--ink); font-weight: 650; }
.eq-term.total .amt { color: var(--tone); font-size: 1.12rem; }
@media (min-width: 760px) {
  .equation { grid-template-columns: 1fr auto 1fr auto 1fr auto 1fr; align-items: stretch; border-top: 0; margin-top: 22px; background: var(--surface-2); border-radius: 12px; border: 1px solid var(--line); }
  .eq-term { flex-direction: column; align-items: flex-start; justify-content: center; border: 0; padding: 14px 16px; gap: 2px; }
  .eq-term .lbl { font-size: .84rem; }
  .eq-term .amt { font-size: 1.22rem; }
  .eq-term.total { background: color-mix(in srgb, var(--tone) 9%, var(--surface)); border-radius: 0 12px 12px 0; }
  .eq-term.total .amt { font-size: 1.32rem; }
  .eq-term .op { display: none; }
  .eq-op { display: grid; place-items: center; font-family: var(--font-num); font-size: 1.4rem; color: var(--muted); font-weight: 500; }
}
.eq-op { display: none; }
@media (min-width: 760px) { .eq-op { display: grid; } }
.hero-notes { margin-top: 14px; display: flex; flex-direction: column; gap: 8px; }

/* ---------- KPIs ---------- */
.kpi .kpi-label { color: var(--ink-2); font-weight: 600; font-size: .9rem; display: flex; align-items: center; gap: 7px; }
.kpi .kpi-label svg { width: 17px; height: 17px; stroke: var(--muted); }
.kpi .kpi-value { font-family: var(--font-num); font-variant-numeric: tabular-nums; font-size: 1.55rem; font-weight: 700; letter-spacing: -.015em; margin: 4px 0 10px; }
.kv { display: flex; justify-content: space-between; gap: 10px; padding: 5px 0; font-size: .88rem; border-top: 1px solid var(--line); }
.kv:first-of-type { border-top: 0; }
.kv .k { color: var(--ink-2); display: flex; align-items: center; gap: 6px; min-width: 0; }
.kv .k span { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.kv .v { font-weight: 600; }
.note { font-size: .8rem; color: var(--muted); margin-top: 8px; line-height: 1.4; }

/* ---------- Listas ---------- */
.list { display: flex; flex-direction: column; }
.item { display: flex; align-items: center; gap: 12px; padding: 11px 4px; border-top: 1px solid var(--line); background: transparent; border-left: 0; border-right: 0; border-bottom: 0; width: 100%; text-align: left; cursor: pointer; }
.item:first-child { border-top: 0; }
button.item:hover, a.item:hover { background: var(--surface-2); }
.item .ico { width: 38px; height: 38px; border-radius: 11px; display: grid; place-items: center; background: var(--sunken); flex: none; }
.item .ico svg { width: 19px; height: 19px; stroke: var(--ink-2); }
.item .ico.in { background: var(--pos-soft); } .item .ico.in svg { stroke: var(--pos); }
.item .ico.alert { background: var(--neg-soft); } .item .ico.alert svg { stroke: var(--neg); }
.item .main { flex: 1; min-width: 0; }
.item .title { font-weight: 600; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.item .meta { display: flex; flex-wrap: wrap; gap: 4px 10px; font-size: .8rem; color: var(--muted); margin-top: 1px; }
.item .end { text-align: right; display: flex; flex-direction: column; align-items: flex-end; gap: 3px; }
.item .end .amt { font-weight: 650; }
.day-head { display: flex; justify-content: space-between; padding: 14px 4px 6px; font-size: .82rem; font-weight: 650; color: var(--muted); border-bottom: 1px solid var(--line); }
.day-head:first-child { padding-top: 0; }

.filters { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; margin-bottom: 12px; }
.filters .search { grid-column: 1 / -1; }
@media (min-width: 760px) { .filters { grid-template-columns: 2fr repeat(4, 1fr); } .filters .search { grid-column: auto; } }
.month-nav { display: flex; align-items: center; gap: 4px; }
.month-nav strong { min-width: 140px; text-align: center; text-transform: capitalize; }
.totals { display: flex; gap: 8px; flex-wrap: wrap; margin-bottom: 12px; }
.totals .chip { background: var(--surface); border: 1px solid var(--line); border-radius: 10px; padding: 7px 12px; font-size: .84rem; }
.totals .chip b { font-family: var(--font-num); font-variant-numeric: tabular-nums; margin-left: 6px; }

/* ---------- Barras de categorías ---------- */
.bars { display: flex; flex-direction: column; gap: 10px; }
.bar-row .bar-top { display: flex; justify-content: space-between; gap: 10px; font-size: .86rem; margin-bottom: 4px; }
.bar-row .bar-top .name { color: var(--ink-2); font-weight: 550; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.bar-track { height: 8px; background: var(--sunken); border-radius: 4px; overflow: hidden; }
.bar-fill { height: 100%; background: var(--accent); border-radius: 0 4px 4px 0; min-width: 3px; }
.stacked { display: flex; height: 10px; border-radius: 5px; overflow: hidden; gap: 2px; background: var(--surface); margin: 10px 0 8px; }
.stacked span { display: block; height: 100%; }
.legend { display: flex; flex-wrap: wrap; gap: 6px 14px; font-size: .8rem; color: var(--ink-2); }
.legend i { display: inline-block; width: 10px; height: 10px; border-radius: 3px; margin-right: 6px; vertical-align: -1px; }

/* ---------- Tarjetas y préstamos ---------- */
.debt-card { display: flex; flex-direction: column; gap: 12px; }
.debt-top { display: flex; justify-content: space-between; align-items: flex-start; gap: 10px; }
.debt-top .t { font-weight: 650; font-size: 1.02rem; }
.split { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }
.box { background: var(--surface-2); border: 1px solid var(--line); border-radius: 11px; padding: 11px 12px; }
.box .lbl { font-size: .78rem; color: var(--muted); font-weight: 600; }
.box .val { font-family: var(--font-num); font-variant-numeric: tabular-nums; font-weight: 700; font-size: 1.08rem; margin-top: 2px; }
.box .sub { font-size: .78rem; color: var(--ink-2); margin-top: 2px; }
.progress { height: 8px; background: var(--sunken); border-radius: 4px; overflow: hidden; }
.progress > span { display: block; height: 100%; background: var(--pos); border-radius: 0 4px 4px 0; }
.actions { display: flex; gap: 8px; flex-wrap: wrap; }
details.more > summary { cursor: pointer; font-weight: 600; font-size: .88rem; color: var(--accent); list-style: none; display: inline-flex; align-items: center; gap: 4px; }
details.more > summary::-webkit-details-marker { display: none; }
details.more > summary svg { width: 16px; height: 16px; transition: transform .15s; }
details.more[open] > summary svg { transform: rotate(90deg); }
details.more > div { margin-top: 12px; }

/* ---------- Tablas ---------- */
.table-wrap { overflow-x: auto; -webkit-overflow-scrolling: touch; }
table { width: 100%; border-collapse: collapse; font-size: .86rem; }
th, td { white-space: nowrap; padding: 9px 10px; text-align: left; border-bottom: 1px solid var(--line); vertical-align: top; }
th { font-weight: 650; color: var(--muted); font-size: .78rem; white-space: nowrap; }
td.r, th.r { text-align: right; }
tbody tr.clickable { cursor: pointer; }
tbody tr.clickable:hover { background: var(--surface-2); }
tr.neg-row td { background: color-mix(in srgb, var(--neg-soft) 60%, transparent); }
tr.detail-row td { background: var(--surface-2); padding: 12px 14px; }

/* ---------- Gráfico de proyección ---------- */
.chart { position: relative; }
.chart svg { display: block; width: 100%; height: auto; overflow: visible; }
.chart .tip { position: absolute; pointer-events: none; background: var(--ink); color: var(--bg); padding: 7px 10px; border-radius: 8px; font-size: .8rem; transform: translate(-50%, -110%); white-space: nowrap; opacity: 0; transition: opacity .1s; }
.chart .tip.show { opacity: 1; }

/* ---------- Formularios ---------- */
.field { display: flex; flex-direction: column; gap: 5px; }
.field > label, .field > .label { font-size: .84rem; font-weight: 600; color: var(--ink-2); }
.field .hint { font-size: .78rem; color: var(--muted); }
.field .err { font-size: .8rem; color: var(--neg); font-weight: 550; }
.input, select.input, textarea.input { height: 44px; padding: 0 12px; border: 1px solid var(--line-2); border-radius: 10px; background: var(--surface); width: 100%; min-width: 0; }
textarea.input { height: auto; min-height: 72px; padding: 10px 12px; resize: vertical; }
.input:focus { outline: 2px solid var(--accent); outline-offset: -1px; border-color: transparent; }
.input[aria-invalid="true"] { border-color: var(--neg); }
.input-money { font-family: var(--font-num); font-variant-numeric: tabular-nums; font-size: 1.6rem; font-weight: 700; height: 58px; letter-spacing: -.01em; }
.money-wrap { position: relative; }
.money-wrap::before { content: "$"; position: absolute; left: 13px; top: 50%; transform: translateY(-50%); font-weight: 600; color: var(--muted); font-family: var(--font-num); }
.money-wrap .input { padding-left: 28px; }
.money-wrap.big::before { font-size: 1.4rem; left: 14px; }
.money-wrap.big .input { padding-left: 34px; }
.form-grid { display: grid; gap: 14px; }
@media (min-width: 560px) { .form-grid.two { grid-template-columns: 1fr 1fr; } .span-2 { grid-column: 1 / -1; } }
.check { display: flex; align-items: flex-start; gap: 10px; font-size: .9rem; cursor: pointer; }
.check input { width: 18px; height: 18px; margin-top: 2px; accent-color: var(--accent); flex: none; }
.callout { padding: 11px 13px; border-radius: 10px; background: var(--surface-2); border: 1px solid var(--line); font-size: .85rem; color: var(--ink-2); }
.callout.warn { background: var(--warn-soft); border-color: transparent; color: var(--ink); }
.callout.info { background: var(--accent-soft); border-color: transparent; color: var(--ink); }
.callout b { font-family: var(--font-num); }
[hidden] { display: none !important; }

/* ---------- Diálogo ---------- */
dialog.sheet { border: 0; padding: 0; background: var(--surface); color: var(--ink); width: 100%; max-width: 560px; max-height: 92vh; border-radius: 18px; box-shadow: 0 20px 60px rgba(0,0,0,.3); }
dialog.sheet::backdrop { background: rgba(10, 20, 32, .48); }
dialog.sheet form { display: flex; flex-direction: column; max-height: 92vh; }
.sheet-head { display: flex; align-items: center; justify-content: space-between; padding: 16px 18px 10px; }
.sheet-head h2 { font-size: 1.12rem; }
.sheet-body { padding: 6px 18px 18px; overflow-y: auto; }
.sheet-foot { display: flex; gap: 8px; padding: 12px 18px; border-top: 1px solid var(--line); background: var(--surface); padding-bottom: max(12px, env(safe-area-inset-bottom)); }
.sheet-foot .grow { flex: 1; }
@media (max-width: 559px) {
  dialog.sheet { margin: auto 0 0; max-width: none; border-radius: 18px 18px 0 0; max-height: 94vh; }
  dialog.sheet form { max-height: 94vh; }
  dialog.sheet[open] { animation: up .2s ease-out; }
  @keyframes up { from { transform: translateY(30px); opacity: .6; } to { transform: none; opacity: 1; } }
}

/* ---------- Toast ---------- */
.toasts { position: fixed; z-index: 100; left: 50%; transform: translateX(-50%); bottom: calc(var(--nav-h) + 84px); display: flex; flex-direction: column; gap: 8px; width: min(92vw, 420px); }
@media (min-width: 920px) { .toasts { bottom: 24px; } }
.toast { display: flex; align-items: center; gap: 10px; padding: 11px 14px; background: var(--ink); color: var(--bg); border-radius: 12px; font-size: .9rem; box-shadow: 0 8px 24px rgba(0,0,0,.2); }
.toast .grow { flex: 1; }
.toast button { background: transparent; border: 0; color: var(--bg); font-weight: 700; text-decoration: underline; cursor: pointer; padding: 2px 4px; }
.toast.error { background: var(--neg); color: #fff; }

/* ---------- Estados vacíos y bienvenida ---------- */
.empty { text-align: center; padding: 30px 16px; color: var(--ink-2); }
.empty svg { width: 36px; height: 36px; stroke: var(--muted); margin-bottom: 8px; }
.empty h3 { margin-bottom: 4px; color: var(--ink); }
.empty p { font-size: .9rem; color: var(--muted); max-width: 380px; margin: 0 auto 14px; }
.welcome { max-width: 640px; margin: 6vh auto 0; }
.welcome h1 { font-size: 1.9rem; margin-bottom: 8px; }
.welcome .lead { color: var(--ink-2); font-size: 1.02rem; margin-bottom: 22px; }
.choice { display: flex; gap: 14px; align-items: flex-start; text-align: left; width: 100%; padding: 18px; border-radius: 14px; border: 1px solid var(--line-2); background: var(--surface); cursor: pointer; }
.choice + .choice { margin-top: 10px; }
.choice:hover { border-color: var(--accent); }
.choice svg { width: 26px; height: 26px; stroke: var(--accent); flex: none; margin-top: 2px; }
.choice strong { display: block; font-size: 1.02rem; margin-bottom: 2px; }
.choice span { color: var(--muted); font-size: .9rem; }
.steps { counter-reset: s; display: flex; flex-direction: column; gap: 2px; }
.steps .item .ico { font-weight: 700; color: var(--ink-2); font-family: var(--font-num); }
.steps .item.done .ico { background: var(--pos-soft); }
.steps .item.done .ico svg { stroke: var(--pos); }
.demo-flag { display: inline-flex; align-items: center; gap: 6px; height: 26px; padding: 0 10px; border-radius: 13px; background: var(--warn-soft); color: var(--warn); font-size: .76rem; font-weight: 700; }
.demo-flag svg { width: 14px; height: 14px; }
.cat-row { display: grid; grid-template-columns: 1fr auto auto; gap: 8px; align-items: center; padding: 7px 0; border-top: 1px solid var(--line); }
.cat-row:first-child { border-top: 0; }
.cat-row select { height: 34px; font-size: .84rem; width: 136px; }
.group-title { font-weight: 650; margin: 16px 0 4px; font-size: .9rem; display: flex; justify-content: space-between; }
.group-title:first-child { margin-top: 0; }
svg.i { width: 20px; height: 20px; fill: none; stroke: currentColor; stroke-width: 1.9; stroke-linecap: round; stroke-linejoin: round; }
</style>

<script>
/* =====================================================================
   MÓDULO: Engine — cálculos financieros puros (sin DOM, sin storage)
   ---------------------------------------------------------------------
   Reglas de diseño:
   - Todos los importes se manejan en CENTAVOS ENTEROS (evita errores de
     punto flotante). La UI convierte al mostrar.
   - Las fechas son strings 'YYYY-MM-DD' (fecha local, sin hora) y los
     períodos 'YYYY-MM'. Se comparan lexicográficamente.
   - Un único libro de movimientos (state.txs) es la fuente de verdad.
     Tarjetas, préstamos y recurrentes se DERIVAN de él: nunca se guarda
     el mismo egreso en dos lugares.
   Tipos de movimiento (tx.kind):
     ingreso            → ingreso económico; suma caja si está cobrado
     gasto              → gasto económico; resta caja si se pagó con cuenta,
                          o genera deuda si se pagó con tarjeta (cardId)
     transferencia      → mueve caja entre cuentas, sin efecto económico
     pago_tarjeta       → resta caja y cancela deuda de tarjeta (no es gasto)
     pago_prestamo      → resta caja; capital cancela deuda, interés es gasto
     prestamo_recibido  → suma caja; no es ingreso (es deuda)
   ===================================================================== */
const Engine = (() => {
  'use strict';

  /* ---------------- Dinero ---------------- */
  const Money = {
    /** Convierte texto en formato argentino o internacional a centavos. NaN si no es válido. */
    parse(input) {
      if (typeof input === 'number') return Number.isFinite(input) ? Math.round(input * 100) : NaN;
      let s = String(input ?? '').trim().replace(/\s|\$|ARS/gi, '');
      if (!s) return NaN;
      let neg = false;
      if (s.startsWith('-')) { neg = true; s = s.slice(1); }
      if (s.includes(',')) {
        // Formato AR: puntos = miles, coma = decimales
        s = s.replace(/\./g, '').replace(',', '.');
      } else if ((s.match(/\./g) || []).length > 1 || /^\d{1,3}(\.\d{3})+$/.test(s)) {
        // "1.234.567" o "12.500" → puntos de miles
        s = s.replace(/\./g, '');
      }
      if (!/^\d+(\.\d{0,2})?$/.test(s)) return NaN;
      const [ent, dec = ''] = s.split('.');
      const cents = parseInt(ent, 10) * 100 + parseInt((dec + '00').slice(0, 2), 10);
      return neg ? -cents : cents;
    },
    /** Formatea centavos como ARS. Muestra decimales solo si existen. */
    format(cents, { sign = false, decimals = 'auto' } = {}) {
      if (cents == null || Number.isNaN(cents)) return '—';
      const abs = Math.abs(cents);
      const showDec = decimals === 'always' || (decimals === 'auto' && abs % 100 !== 0);
      const nf = new Intl.NumberFormat('es-AR', {
        minimumFractionDigits: showDec ? 2 : 0, maximumFractionDigits: showDec ? 2 : 0,
      });
      const txt = '$ ' + nf.format(abs / 100);
      if (cents < 0) return '−' + txt;
      if (sign && cents > 0) return '+' + txt;
      return txt;
    },
    /** Para CSV/Excel AR: 1234,56 (sin miles, coma decimal). */
    plain(cents) {
      const neg = cents < 0; const a = Math.abs(cents);
      return (neg ? '-' : '') + Math.floor(a / 100) + ',' + String(a % 100).padStart(2, '0');
    },
    /** Divide un total en n cuotas que suman exactamente el total. El resto va en la 1ª cuota. */
    split(total, n) {
      n = Math.max(1, n | 0);
      const base = Math.floor(total / n);
      const out = Array(n).fill(base);
      out[0] += total - base * n;
      return out;
    },
  };

  /* ---------------- Fechas ---------------- */
  const pad = (n) => String(n).padStart(2, '0');
  const D = {
    today() { const d = new Date(); return `${d.getFullYear()}-${pad(d.getMonth() + 1)}-${pad(d.getDate())}`; },
    valid(s) {
      if (!/^\d{4}-\d{2}-\d{2}$/.test(s || '')) return false;
      const [y, m, d] = s.split('-').map(Number);
      return m >= 1 && m <= 12 && d >= 1 && d <= D.daysIn(y, m);
    },
    parts(s) { const [y, m, d] = s.split('-').map(Number); return { y, m, d }; },
    daysIn(y, m) { return new Date(Date.UTC(y, m, 0)).getUTCDate(); },
    make(y, m, d) {
      // normaliza mes fuera de rango y recorta el día al largo del mes
      const yy = y + Math.floor((m - 1) / 12); const mm = ((m - 1) % 12 + 12) % 12 + 1;
      return `${yy}-${pad(mm)}-${pad(Math.min(Math.max(1, d), D.daysIn(yy, mm)))}`;
    },
    period(s) { return s.slice(0, 7); },
    addMonths(s, n) { const { y, m, d } = D.parts(s); return D.make(y, m + n, d); },
    /** Suma meses manteniendo un día "ancla" (ej. 31 → fin de mes en meses cortos). */
    addMonthsAnchor(s, n, anchorDay) { const { y, m } = D.parts(s); return D.make(y, m + n, anchorDay); },
    addDays(s, n) {
      const { y, m, d } = D.parts(s); const t = new Date(Date.UTC(y, m - 1, d + n));
      return `${t.getUTCFullYear()}-${pad(t.getUTCMonth() + 1)}-${pad(t.getUTCDate())}`;
    },
    diffDays(a, b) { // b - a
      const pa = D.parts(a), pb = D.parts(b);
      return Math.round((Date.UTC(pb.y, pb.m - 1, pb.d) - Date.UTC(pa.y, pa.m - 1, pa.d)) / 864e5);
    },
    addPeriod(p, n) { const [y, m] = p.split('-').map(Number); return D.make(y, m + n, 1).slice(0, 7); },
    periodDiff(a, b) { // meses de a hasta b
      const [ya, ma] = a.split('-').map(Number), [yb, mb] = b.split('-').map(Number);
      return (yb - ya) * 12 + (mb - ma);
    },
    periodStart(p) { return p + '-01'; },
    periodEnd(p) { const [y, m] = p.split('-').map(Number); return `${p}-${pad(D.daysIn(y, m))}`; },
    dayIn(p, day) { const [y, m] = p.split('-').map(Number); return D.make(y, m, day); },
  };

  const FREQ = {
    mensual: { months: 1, label: 'Mensual' },
    bimestral: { months: 2, label: 'Bimestral' },
    trimestral: { months: 3, label: 'Trimestral' },
    semestral: { months: 6, label: 'Semestral' },
    anual: { months: 12, label: 'Anual' },
    quincenal: { days: 15, label: 'Quincenal' },
    semanal: { days: 7, label: 'Semanal' },
    unico: { once: true, label: 'Pago único' },
    ninguna: { none: true, label: 'Sin frecuencia fija' },
  };
  /** Fecha de la k-ésima ocurrencia a partir de "first" (k=0 → first). */
  function nthDate(first, freq, k, anchorDay) {
    const f = FREQ[freq];
    if (!f || f.none) return null;
    if (f.once) return k === 0 ? first : null;
    if (f.days) return D.addDays(first, f.days * k);
    return D.addMonthsAnchor(first, f.months * k, anchorDay || D.parts(first).d);
  }

  /* ---------------- Efectos de un movimiento ---------------- */
  const effDate = (tx) => tx.paidDate || tx.date;
  const isPaid = (tx) => tx.status !== 'pendiente';

  /** Variaciones de caja por cuenta que produce un movimiento ya efectivo. */
  function cashDeltas(tx) {
    if (!isPaid(tx)) return [];
    switch (tx.kind) {
      case 'ingreso': case 'prestamo_recibido':
        return tx.accountId ? [[tx.accountId, tx.amount]] : [];
      case 'gasto':
        return tx.cardId || !tx.accountId ? [] : [[tx.accountId, -tx.amount]];
      case 'transferencia':
        return [[tx.accountId, -tx.amount], [tx.toAccountId, tx.amount]];
      case 'pago_tarjeta': case 'pago_prestamo':
        return tx.accountId ? [[tx.accountId, -tx.amount]] : [];
      default: return [];
    }
  }

  /** Gasto económico (devengado) que representa un movimiento. Pagos de deuda no son gasto, salvo el interés. */
  function economicExpense(tx) {
    if (tx.kind === 'gasto') return tx.amount;
    if (tx.kind === 'pago_prestamo') return tx.interest || 0;
    return 0;
  }

  function accountBalance(acc, txs) {
    let bal = acc.openingBalance || 0;
    const from = acc.openingDate || '0000-00-00';
    for (const tx of txs) {
      if (effDate(tx) < from) continue;
      for (const [id, d] of cashDeltas(tx)) if (id === acc.id) bal += d;
    }
    return bal;
  }

  function availableCash(state) {
    return state.accounts.filter((a) => !a.archived)
      .reduce((s, a) => s + accountBalance(a, state.txs), 0);
  }

  /* ---------------- Tarjetas de crédito ---------------- */
  /** Período de resumen (mes de cierre) en el que entra una compra. */
  function cardPeriodFor(card, date) {
    const st = (card.statements || []).find((s) => s.period === D.period(date));
    const closing = st?.closingDate || D.dayIn(D.period(date), card.closingDay);
    return date <= closing ? D.period(date) : D.addPeriod(D.period(date), 1);
  }

  /** Fechas de cierre y vencimiento de un período. Si no hay resumen registrado se estiman con la configuración. */
  function statementDates(card, period) {
    const st = (card.statements || []).find((s) => s.period === period);
    if (st && st.closingDate && st.dueDate) return { closingDate: st.closingDate, dueDate: st.dueDate, estimated: false, statement: st };
    const closingDate = D.dayIn(period, card.closingDay);
    const duePeriod = card.dueDay > card.closingDay ? period : D.addPeriod(period, 1);
    return { closingDate, dueDate: D.dayIn(duePeriod, card.dueDay), estimated: true, statement: st || null };
  }

  /** Cuotas de un movimiento cargado a tarjeta: [{period, amount, n, of}] */
  function cardInstallments(card, tx) {
    const n = Math.max(1, tx.installments || 1);
    const first = tx.firstPeriod || cardPeriodFor(card, tx.date);
    return Money.split(tx.amount, n).map((amount, i) => ({ period: D.addPeriod(first, i), amount, n: i + 1, of: n, tx }));
  }

  /**
   * Estado completo de una tarjeta.
   * Los pagos se aplican en orden FIFO a los resúmenes más antiguos con saldo.
   * extraTxs: cargos virtuales (recurrentes futuros) para proyección.
   */
  function cardState(card, txs, today, extraTxs = []) {
    const charges = txs.filter((t) => t.kind === 'gasto' && t.cardId === card.id).concat(extraTxs);
    const payments = txs.filter((t) => t.kind === 'pago_tarjeta' && t.cardId === card.id)
      .sort((a, b) => a.date.localeCompare(b.date));
    const byPeriod = new Map();
    for (const tx of charges) {
      for (const inst of cardInstallments(card, tx)) {
        if (!byPeriod.has(inst.period)) byPeriod.set(inst.period, []);
        byPeriod.get(inst.period).push(inst);
      }
    }
    // incluir períodos con resumen registrado aunque no tengan cargos
    for (const s of card.statements || []) if (!byPeriod.has(s.period)) byPeriod.set(s.period, []);

    let toAllocate = payments.reduce((s, p) => s + p.amount, 0);
    let openAssigned = false;
    const periods = [...byPeriod.keys()].sort().map((period) => {
      const items = byPeriod.get(period);
      const amount = items.reduce((s, i) => s + i.amount, 0);
      const paid = Math.min(amount, Math.max(0, toAllocate));
      toAllocate -= paid;
      const dates = statementDates(card, period);
      const outstanding = amount - paid;
      const isOpen = dates.closingDate >= today;
      let status;
      if (isOpen) { status = openAssigned ? 'futuro' : 'abierto'; openAssigned = true; }
      else if (amount === 0) status = 'sin_consumos';
      else if (outstanding === 0) status = 'pagado';
      else if (dates.dueDate < today) status = 'vencido';
      else status = paid > 0 ? 'parcial' : 'a_pagar';
      return { period, ...dates, items, amount, paid, outstanding, status };
    });
    const totalCharged = charges.reduce((s, t) => s + t.amount, 0);
    const totalPaid = payments.reduce((s, p) => s + p.amount, 0);
    const credit = Math.max(0, toAllocate); // pagos que exceden lo cargado (saldo a favor)
    const debt = totalCharged - totalPaid;
    const closedUnpaid = periods.filter((p) => p.closingDate < today && p.outstanding > 0);
    const open = periods.find((p) => p.closingDate >= today) || null;
    return {
      card, periods, payments, debt, credit,
      dueNow: closedUnpaid.reduce((s, p) => s + p.outstanding, 0), // resúmenes cerrados impagos
      nextToPay: closedUnpaid[0] || null,
      open,
      future: periods.filter((p) => p.closingDate >= today).reduce((s, p) => s + p.outstanding, 0),
    };
  }

  /* ---------------- Préstamos y deudas ---------------- */
  function loanPayments(loan, txs) {
    return txs.filter((t) => t.kind === 'pago_prestamo' && t.loanId === loan.id)
      .sort((a, b) => a.date.localeCompare(b.date) || (a.createdAt || 0) - (b.createdAt || 0));
  }

  /** Interés sugerido para el próximo pago. Nunca se inventa: requiere tasa o cuotas fijas. */
  function suggestInterest(loan, balance, amount, ls) {
    if (balance == null || balance <= 0 || amount <= 0) return { interest: 0, basis: 'none' };
    if (loan.rate > 0) {
      const f = FREQ[loan.frequency] || FREQ.mensual;
      const periodsPerYear = f.months ? 12 / f.months : f.days ? 365 / f.days : 12;
      const i = Math.round(balance * (loan.rate / 100) / periodsPerYear);
      return { interest: Math.min(i, amount), basis: 'rate' };
    }
    if (loan.installments && loan.installmentAmount && ls && ls.remainingCount > 0) {
      const payable = loan.installmentAmount * ls.remainingCount;
      if (payable > balance) {
        // interés implícito: proporción de lo que se pagará por encima del saldo
        const i = Math.round(amount * (payable - balance) / payable);
        return { interest: i, basis: 'implicit' };
      }
    }
    return { interest: 0, basis: 'none' };
  }

  /**
   * Estado de un préstamo. Si el saldo no fue informado (initialBalance null),
   * no se inventa: la deuda figura "sin informar" y la cuota se proyecta mes a mes
   * hasta que se carguen el saldo o las cuotas restantes.
   */
  const OPEN_ENDED_MONTHS = 36;
  function loanState(loan, txs, today) {
    const pays = loanPayments(loan, txs);
    const known = loan.initialBalance != null;
    let balance = known ? loan.initialBalance : null;
    const history = known ? [{ date: loan.createdDate || loan.nextDueDate || (pays[0]?.date) || today, balance }] : [];
    let capitalPaid = 0, interestPaid = 0, cuotasSince = 0;
    for (const p of pays) {
      const capital = p.amount - (p.interest || 0);
      capitalPaid += capital; interestPaid += p.interest || 0;
      if (known) { balance -= capital; history.push({ date: p.date, balance }); }
      if (p.paymentType === 'cuota') cuotasSince++;
    }
    const cuotasPaid = (loan.paidBefore || 0) + cuotasSince;
    const total = loan.installments || null;
    const remainingCount = total ? Math.max(0, total - cuotasPaid) : null;
    const closed = known ? balance <= 0 : (total ? remainingCount === 0 : pays.some((p) => p.paymentType === 'cancelacion'));
    // Cronograma de vencimientos impagos
    const schedule = [];
    let scheduleEstimated = false, openEnded = false;
    const f = FREQ[loan.frequency];
    if (!closed && loan.nextDueDate && f && !f.none) {
      let count;
      if (f.once) count = 1;
      else if (total) count = remainingCount;
      else if (loan.installmentAmount > 0 && known) { count = Math.ceil(balance / loan.installmentAmount); scheduleEstimated = true; }
      else if (loan.installmentAmount > 0) { count = f.days ? Math.ceil(OPEN_ENDED_MONTHS * 30 / f.days) : Math.ceil(OPEN_ENDED_MONTHS / f.months); openEnded = true; }
      else count = 0;
      count = Math.min(count, 600);
      const anchor = D.parts(loan.nextDueDate).d;
      for (let i = 0; i < count; i++) {
        const date = nthDate(loan.nextDueDate, loan.frequency, (f.once ? 0 : cuotasSince) + i, anchor);
        if (!date) break;
        let amount = f.once ? (known ? balance : loan.installmentAmount || 0) : loan.installmentAmount || 0;
        if (scheduleEstimated && i === count - 1) amount = balance - loan.installmentAmount * (count - 1);
        if (amount <= 0) continue;
        schedule.push({ date, amount, n: total ? cuotasPaid + i + 1 : null, of: total });
      }
    }
    return {
      loan, payments: pays, balance, balanceKnown: known, capitalPaid, interestPaid, cuotasPaid, total,
      remainingCount, closed, schedule, scheduleEstimated, openEnded, history,
      estCancel: schedule.length && !openEnded ? schedule[schedule.length - 1].date : null,
      overdue: schedule.filter((s) => s.date < today),
      next: schedule[0] || null,
      progress: known && loan.originalAmount > 0 ? Math.min(1, Math.max(0, 1 - balance / loan.originalAmount)) : null,
    };
  }

  /* ---------------- Gastos/ingresos recurrentes ---------------- */
  function recStep(rec) { return (FREQ[rec.frequency] || FREQ.mensual).months || 1; }
  function recOccursIn(rec, period) {
    if (!rec.active) return false;
    const startP = D.period(rec.startDate);
    if (period < startP) return false;
    if (rec.endDate && period > D.period(rec.endDate)) return false;
    return D.periodDiff(startP, period) % recStep(rec) === 0;
  }
  /** Importe vigente para un período (historial de cambios: no altera pagos anteriores). */
  function recAmountFor(rec, period) {
    const list = (rec.amounts || []).slice().sort((a, b) => a.from.localeCompare(b.from));
    let amt = list.length ? list[0].amount : 0;
    for (const a of list) if (a.from <= period) amt = a.amount;
    return amt;
  }
  function recDueDate(rec, period) {
    const d = D.dayIn(period, rec.dueDay || D.parts(rec.startDate).d);
    return d < rec.startDate ? rec.startDate : d;
  }
  const recKey = (recId, period) => recId + '@' + period;

  /**
   * Genera los movimientos previstos de las recurrencias hasta el mes actual.
   * Idempotente: usa la clave recurrencia+período y respeta los períodos omitidos.
   */
  function materializeRecurring(state, today, makeId) {
    const existing = new Set(state.txs.filter((t) => t.recId).map((t) => recKey(t.recId, t.recPeriod)));
    const nowP = D.period(today);
    const created = [];
    for (const rec of state.recurrings) {
      if (!rec.active) continue;
      let p = rec.materializeFrom && rec.materializeFrom > D.period(rec.startDate) ? rec.materializeFrom : D.period(rec.startDate);
      for (let guard = 0; p <= nowP && guard < 240; p = D.addPeriod(p, 1), guard++) {
        if (!recOccursIn(rec, p)) continue;
        if ((rec.skipped || []).includes(p) || existing.has(recKey(rec.id, p))) continue;
        const tx = recInstance(rec, p);
        tx.id = makeId(); tx.createdAt = Date.now();
        state.txs.push(tx); existing.add(recKey(rec.id, p)); created.push(tx);
      }
    }
    return created;
  }
  function recInstance(rec, period) {
    return {
      kind: rec.type, amount: recAmountFor(rec, period), date: recDueDate(rec, period),
      categoryId: rec.categoryId, description: rec.name,
      accountId: rec.cardId ? null : rec.accountId, cardId: rec.cardId || null, installments: 1,
      status: rec.cardId ? 'pagado' : 'pendiente', recId: rec.id, recPeriod: period,
      estimated: !!rec.estimated,
    };
  }
  /** Próxima ocurrencia pendiente de una recurrencia (pendiente registrada o futura). */
  function recNext(rec, state, today) {
    const pend = state.txs.filter((t) => t.recId === rec.id && t.status === 'pendiente').sort((a, b) => a.date.localeCompare(b.date));
    if (pend.length) return { date: pend[0].date, amount: pend[0].amount, tx: pend[0] };
    let p = D.addPeriod(D.period(today), 1);
    for (let i = 0; i < 36; i++, p = D.addPeriod(p, 1)) {
      if (recOccursIn(rec, p) && !(rec.skipped || []).includes(p)) return { date: recDueDate(rec, p), amount: recAmountFor(rec, p), tx: null };
    }
    return null;
  }

  /* ---------------- Mes en curso / dashboard ---------------- */
  function monthSummary(state, today) {
    const P = D.period(today);
    const inMonth = (d) => D.period(d) === P;
    const catById = new Map(state.categories.map((c) => [c.id, c]));
    let incomeReceived = 0, incomePending = 0, paidExp = 0, pendingExp = 0, cardExp = 0, loanInterest = 0;
    const byCat = new Map();
    const byClass = { esencial: 0, ajustable: 0, discrecional: 0 };
    const addCat = (catId, amt) => {
      byCat.set(catId, (byCat.get(catId) || 0) + amt);
      const cls = catById.get(catId)?.cls || 'ajustable';
      byClass[cls] = (byClass[cls] || 0) + amt;
    };
    for (const t of state.txs) {
      if (t.kind === 'ingreso') {
        if (isPaid(t) && inMonth(effDate(t))) incomeReceived += t.amount;
        else if (!isPaid(t) && (inMonth(t.date) || t.date < today)) incomePending += t.amount;
      } else if (t.kind === 'gasto') {
        if (!inMonth(t.date)) {
          // pendientes vencidos de meses anteriores cuentan como pendientes del mes
          if (!t.cardId && !isPaid(t) && t.date < today) pendingExp += t.amount;
          continue;
        }
        if (t.cardId) cardExp += t.amount;
        else if (isPaid(t)) paidExp += t.amount; else pendingExp += t.amount;
        addCat(t.categoryId, t.amount);
      } else if (t.kind === 'pago_prestamo' && inMonth(t.date) && t.interest) {
        loanInterest += t.interest;
        addCat(t.categoryId, t.interest);
      }
    }
    const consumption = [...byCat.values()].reduce((s, v) => s + v, 0);
    return { period: P, incomeReceived, incomePending, paidExp, pendingExp, cardExp, loanInterest, byCat, byClass, consumption, result: incomeReceived + incomePending - consumption };
  }

  function totalDebt(state, today) {
    const cards = state.cards.filter((c) => !c.archived).map((c) => cardState(c, state.txs, today));
    const loans = state.loans.filter((l) => !l.archived).map((l) => loanState(l, state.txs, today));
    const cardDebt = cards.reduce((s, c) => s + Math.max(0, c.debt), 0);
    const loanDebt = loans.reduce((s, l) => s + (l.balanceKnown ? Math.max(0, l.balance) : 0), 0);
    const unknownLoans = loans.filter((l) => !l.balanceKnown && !l.closed).length;
    return { cards, loans, cardDebt, loanDebt, unknownLoans, total: cardDebt + loanDebt };
  }

  /* ---------------- Proyección ---------------- */
  /**
   * "Gasto del día a día": gastos no recurrentes, en un pago, fuera de las categorías de deuda.
   * Es lo que la proyección estima a futuro (supermercado, delivery, farmacia, etc.).
   */
  function isDayToDay(t, debtCats) {
    return t.kind === 'gasto' && !t.recId && (t.installments || 1) === 1 && !debtCats.has(t.categoryId);
  }
  function debtCatSet(state) { return new Set(state.categories.filter((c) => c.group === 'tarjetas' || c.group === 'prestamos').map((c) => c.id)); }
  function variableSpent(state, period, { cardOnly = false } = {}) {
    const dc = debtCatSet(state);
    return state.txs.filter((t) => isDayToDay(t, dc) && D.period(t.date) === period && (!cardOnly || t.cardId))
      .reduce((s, t) => s + t.amount, 0);
  }
  /** Promedio de los últimos 3 meses completos con datos. */
  function suggestVariable(state, today) {
    const P = D.period(today); let sum = 0, n = 0;
    for (let i = 1; i <= 3; i++) { const v = variableSpent(state, D.addPeriod(P, -i)); if (v > 0) { sum += v; n++; } }
    return n ? Math.round(sum / n / 100) * 100 : 0;
  }
  /** Proporción histórica del día a día pagada con tarjeta (se paga al mes siguiente). */
  function cardShare(state, today) {
    const P = D.period(today); let all = 0, card = 0;
    for (let i = 1; i <= 3; i++) { const p = D.addPeriod(P, -i); all += variableSpent(state, p); card += variableSpent(state, p, { cardOnly: true }); }
    return all > 0 ? card / all : 0;
  }

  /**
   * Proyección de caja mes a mes.
   * Cada ítem: {dir:'in'|'out', amount, label, group, confirmed, date, ref}
   * group: ingresos | fijos | prestamos | tarjetas | variables | extra | pendientes
   */
  function project(state, today, months = 6) {
    const P0 = D.period(today);
    const lastP = D.addPeriod(P0, months - 1);
    const catById = new Map(state.categories.map((c) => [c.id, c]));
    const recById = new Map(state.recurrings.map((r) => [r.id, r]));
    const rows = [];
    const buckets = new Map();
    for (let i = 0; i < months; i++) buckets.set(D.addPeriod(P0, i), []);
    const bucketFor = (date) => {
      const p = D.period(date);
      if (p < P0) return buckets.get(P0); // vencidos → mes actual
      return buckets.get(p) || null;
    };
    const push = (date, item) => { const b = bucketFor(date); if (b) b.push({ date, ...item, overdue: date < today }); };

    // 1) Movimientos pendientes registrados (incluye recurrencias ya generadas)
    for (const t of state.txs) {
      if (isPaid(t) || t.cardId) continue;
      if (t.kind !== 'ingreso' && t.kind !== 'gasto') continue;
      const rec = t.recId ? recById.get(t.recId) : null;
      const grp = t.kind === 'ingreso' ? 'ingresos' : (rec ? 'fijos' : (catById.get(t.categoryId)?.group === 'variables' ? 'variables' : 'pendientes'));
      push(t.date, { dir: t.kind === 'ingreso' ? 'in' : 'out', amount: t.amount, label: t.description || catById.get(t.categoryId)?.name || 'Movimiento', group: grp, confirmed: !t.estimated, ref: { type: 'tx', id: t.id } });
    }
    // 2) Recurrencias futuras aún no generadas
    const virtualCard = new Map(); // cardId -> tx[]
    for (const rec of state.recurrings) {
      if (!rec.active) continue;
      for (let p = D.addPeriod(P0, 1); p <= lastP; p = D.addPeriod(p, 1)) {
        if (!recOccursIn(rec, p) || (rec.skipped || []).includes(p)) continue;
        if (state.txs.some((t) => t.recId === rec.id && t.recPeriod === p)) continue;
        const inst = recInstance(rec, p);
        if (rec.cardId) {
          if (!virtualCard.has(rec.cardId)) virtualCard.set(rec.cardId, []);
          virtualCard.get(rec.cardId).push({ ...inst, id: 'v-' + rec.id + p, virtual: true });
          continue;
        }
        push(inst.date, { dir: rec.type === 'ingreso' ? 'in' : 'out', amount: inst.amount, label: rec.name, group: rec.type === 'ingreso' ? 'ingresos' : 'fijos', confirmed: !rec.estimated, ref: { type: 'rec', id: rec.id } });
      }
    }
    // 3) Cuotas de préstamos
    const warnings = [];
    for (const loan of state.loans) {
      if (loan.archived) continue;
      const ls = loanState(loan, state.txs, today);
      if (ls.closed) continue;
      if (!ls.schedule.length && (ls.balance > 0 || !ls.balanceKnown)) warnings.push(ls.balanceKnown ? `“${loan.creditor}” no tiene cuotas o vencimientos definidos: su saldo (${Money.format(ls.balance)}) no se incluye en la proyección.` : `“${loan.creditor}” no tiene cuota ni vencimiento definidos: no se incluye en la proyección.`);
      else if (ls.openEnded) warnings.push(`“${loan.creditor}”: sin saldo ni cuotas restantes informados, la cuota se proyecta todos los meses. Completalo en Deudas y tarjetas.`);
      for (const s of ls.schedule) {
        push(s.date, { dir: 'out', amount: s.amount, label: `${loan.creditor}${s.n ? ` · cuota ${s.n}/${s.of}` : ''}`, group: 'prestamos', confirmed: !ls.scheduleEstimated, ref: { type: 'loan', id: loan.id } });
      }
    }
    // 4) Resúmenes de tarjetas (saldo a pagar según vencimiento)
    for (const card of state.cards) {
      if (card.archived) continue;
      const cs = cardState(card, state.txs, today, virtualCard.get(card.id) || []);
      for (const per of cs.periods) {
        if (per.outstanding <= 0) continue;
        const hasVirtual = per.items.some((i) => i.tx.virtual);
        const hasEstimatedTx = per.items.some((i) => i.tx.estimated);
        push(per.dueDate, { dir: 'out', amount: per.outstanding, label: `${card.name} · resumen ${periodLabel(per.period, true)}`, group: 'tarjetas', confirmed: !hasVirtual && !hasEstimatedTx, ref: { type: 'card', id: card.id, period: per.period }, datesEstimated: per.estimated });
      }
    }
    // 5) Gastos variables estimados y 6) supuestos extraordinarios
    // El consumo estimado de cada mes se divide: la parte que suele ir con tarjeta sale de caja el mes siguiente.
    const proj = state.settings.projection || {};
    const baseVar = proj.variableMonthly || 0;
    const share = cardShare(state, today);
    for (const [p, items] of buckets) {
      let v = proj.overrides && proj.overrides[p] != null ? proj.overrides[p] : baseVar;
      if (p === P0) v = Math.max(0, v - variableSpent(state, P0));
      const viaCard = Math.round(v * share);
      const cash = v - viaCard;
      if (cash > 0) items.push({ date: D.periodEnd(p), dir: 'out', amount: cash, label: p === P0 ? 'Día a día: resto estimado del mes' : 'Día a día estimado', group: 'variables', confirmed: false, ref: { type: 'variable', period: p } });
      const next = buckets.get(D.addPeriod(p, 1));
      if (viaCard > 0 && next) next.push({ date: D.periodStart(D.addPeriod(p, 1)), dir: 'out', amount: viaCard, label: `Día a día con tarjeta de ${periodLabel(p)} (estimado)`, group: 'variables', confirmed: false, ref: { type: 'variable', period: p, card: true } });
    }
    for (const x of proj.extras || []) {
      const b = buckets.get(x.period);
      if (b) b.push({ date: D.periodStart(x.period), dir: x.dir, amount: x.amount, label: x.label, group: 'extra', confirmed: false, ref: { type: 'extra', id: x.id } });
    }

    let balance = availableCash(state);
    const start = balance;
    for (const [p, items] of buckets) {
      items.sort((a, b) => a.date.localeCompare(b.date));
      const income = items.filter((i) => i.dir === 'in').reduce((s, i) => s + i.amount, 0);
      const out = items.filter((i) => i.dir === 'out').reduce((s, i) => s + i.amount, 0);
      const confirmedOut = items.filter((i) => i.dir === 'out' && i.confirmed).reduce((s, i) => s + i.amount, 0);
      const confirmedIn = items.filter((i) => i.dir === 'in' && i.confirmed).reduce((s, i) => s + i.amount, 0);
      const opening = balance;
      balance = opening + income - out;
      const byGroup = {};
      for (const i of items) byGroup[i.group] = (byGroup[i.group] || 0) + (i.dir === 'in' ? i.amount : -i.amount);
      rows.push({ period: p, opening, income, out, confirmedIn, confirmedOut, estimatedIn: income - confirmedIn, estimatedOut: out - confirmedOut, closing: balance, items, byGroup });
    }
    const firstDeficit = rows.find((r) => r.closing < 0) || null;
    return { start, rows, firstDeficit, warnings, minRow: rows.reduce((m, r) => (!m || r.closing < m.closing ? r : m), null) };
  }

  /** Estado del mes actual: disponible + por cobrar − por pagar (sin gastos variables estimados ni supuestos). */
  function monthStatus(state, today) {
    const pr = project(state, today, 1);
    const row = pr.rows[0];
    const committed = row.items.filter((i) => i.group !== 'variables' || i.ref.type === 'tx').filter((i) => i.group !== 'extra');
    const pendingIn = committed.filter((i) => i.dir === 'in').reduce((s, i) => s + i.amount, 0);
    const pendingOut = committed.filter((i) => i.dir === 'out').reduce((s, i) => s + i.amount, 0);
    const variableEst = row.items.filter((i) => i.ref.type === 'variable').reduce((s, i) => s + i.amount, 0);
    const available = pr.start;
    const projected = available + pendingIn - pendingOut;
    return {
      available, pendingIn, pendingOut, projected, variableEst, withVariable: projected - variableEst,
      outs: committed.filter((i) => i.dir === 'out').sort((a, b) => b.amount - a.amount),
      ins: committed.filter((i) => i.dir === 'in'),
      overdue: committed.filter((i) => i.overdue && i.dir === 'out'),
    };
  }

  /** Próximos vencimientos (pagos) desde hoy, vencidos primero. */
  function upcoming(state, today, limit = 5) {
    const pr = project(state, today, 2);
    return pr.rows.flatMap((r) => r.items)
      .filter((i) => i.dir === 'out' && i.ref.type !== 'variable' && i.ref.type !== 'extra')
      .sort((a, b) => a.date.localeCompare(b.date))
      .slice(0, limit);
  }

  /* ---------------- Utilidades de presentación ---------------- */
  const MONTHS = ['enero', 'febrero', 'marzo', 'abril', 'mayo', 'junio', 'julio', 'agosto', 'septiembre', 'octubre', 'noviembre', 'diciembre'];
  const MONTHS_S = ['ene', 'feb', 'mar', 'abr', 'may', 'jun', 'jul', 'ago', 'sep', 'oct', 'nov', 'dic'];
  function periodLabel(p, short = false) {
    const [y, m] = p.split('-').map(Number);
    return short ? `${MONTHS_S[m - 1]} ${y}` : `${MONTHS[m - 1]} ${y}`;
  }
  function dateLabel(s, { year = false } = {}) {
    const { y, m, d } = D.parts(s);
    return `${d} ${MONTHS_S[m - 1]}${year ? ' ' + y : ''}`;
  }

  return {
    Money, D, FREQ, nthDate, effDate, isPaid, cashDeltas, economicExpense, accountBalance, availableCash,
    cardPeriodFor, statementDates, cardInstallments, cardState,
    loanPayments, loanState, suggestInterest,
    recOccursIn, recAmountFor, recDueDate, materializeRecurring, recNext,
    monthSummary, totalDebt, variableSpent, suggestVariable, cardShare, project, monthStatus, upcoming,
    periodLabel, dateLabel, MONTHS,
  };
})();

</script>
<script>
/* =====================================================================
   MÓDULO: Store — persistencia local, perfiles, respaldo y datos demo
   ---------------------------------------------------------------------
   - Dos perfiles en claves separadas de localStorage:
       real → tus datos;  demo → datos ficticios para probar.
     Nunca se mezclan: cambiar de perfil cambia la clave de lectura/escritura.
   - El respaldo JSON incluye perfil, versión de esquema y fecha.
   - No se guardan contraseñas, números de tarjeta ni credenciales.
   ===================================================================== */
const Store = (() => {
  'use strict';
  const { D, Money } = Engine;
  const SCHEMA = 2; // v2: préstamos con saldo sin informar (initialBalance null)
  const KEY = { meta: 'misFinanzas:meta', real: 'misFinanzas:v1:real', demo: 'misFinanzas:v1:demo' };
  const uid = () => Date.now().toString(36) + Math.random().toString(36).slice(2, 8);

  const GROUPS = [
    { id: 'vivienda', name: 'Vivienda', kind: 'gasto' },
    { id: 'alimentacion', name: 'Alimentación y necesidades básicas', kind: 'gasto' },
    { id: 'tarjetas', name: 'Tarjetas de crédito', kind: 'gasto' },
    { id: 'prestamos', name: 'Préstamos', kind: 'gasto' },
    { id: 'variables', name: 'Gastos variables', kind: 'gasto' },
    { id: 'otros', name: 'Otros gastos', kind: 'gasto' },
    { id: 'ingresos', name: 'Ingresos', kind: 'ingreso' },
  ];
  const DEFAULT_CATS = {
    vivienda: [['Alquiler', 'esencial'], ['Expensas', 'esencial'], ['Electricidad', 'esencial'], ['Gas', 'esencial'], ['Agua', 'esencial'], ['Internet', 'ajustable'], ['ABL e impuestos', 'esencial']],
    alimentacion: [['Supermercado', 'esencial'], ['Verdulería', 'esencial'], ['Carnicería', 'esencial'], ['Alimentos', 'esencial'], ['Higiene', 'esencial'], ['Farmacia', 'esencial'], ['Transporte esencial', 'esencial']],
    tarjetas: [['Compras', 'ajustable'], ['Cuotas', 'ajustable'], ['Resúmenes', 'esencial'], ['Intereses y cargos', 'esencial']],
    prestamos: [['Préstamos bancarios', 'esencial'], ['Préstamos de la empresa', 'esencial'], ['Préstamos familiares', 'esencial'], ['Dinero prestado por amigos', 'esencial'], ['Otros compromisos', 'esencial']],
    variables: [['Delivery', 'discrecional'], ['Kiosco', 'discrecional'], ['Café', 'discrecional'], ['Salidas', 'discrecional'], ['Suscripciones', 'ajustable'], ['Entretenimiento', 'discrecional'], ['Compras personales', 'discrecional']],
    otros: [['Otros gastos', 'ajustable']],
    ingresos: [['Sueldo', 'esencial'], ['Aguinaldo', 'esencial'], ['Bonos', 'ajustable'], ['Ingresos adicionales', 'ajustable'], ['Otros', 'ajustable']],
  };
  // ids estables para categorías por defecto (permiten referencias en demo)
  const slug = (s) => s.normalize('NFD').replace(/[̀-ͯ]/g, '').toLowerCase().replace(/[^a-z0-9]+/g, '-').replace(/^-|-$/g, '');
  function defaultCategories() {
    const out = [];
    for (const g of GROUPS) for (const [name, cls] of DEFAULT_CATS[g.id]) out.push({ id: 'cat-' + slug(name), name, group: g.id, kind: g.kind, cls });
    return out;
  }

  function emptyState() {
    return {
      schemaVersion: SCHEMA,
      accounts: [{ id: 'acc-efectivo', name: 'Efectivo', type: 'efectivo', openingBalance: 0, openingDate: D.today(), archived: false }],
      categories: defaultCategories(),
      txs: [], recurrings: [], loans: [], cards: [],
      settings: { lastBackupAt: null, projection: { variableMonthly: 0, overrides: {}, extras: [] }, hideAmounts: false },
    };
  }

  /* ---------------- Perfiles y almacenamiento ---------------- */
  let profile = 'real';
  function readMeta() { try { return JSON.parse(localStorage.getItem(KEY.meta)) || {}; } catch { return {}; } }
  function writeMeta(m) { try { localStorage.setItem(KEY.meta, JSON.stringify(m)); } catch { /* sin espacio */ } }

  function load(p) {
    profile = p;
    const raw = localStorage.getItem(KEY[p]);
    if (!raw) return null;
    try { return migrate(JSON.parse(raw)); } catch (e) { console.error('Datos corruptos', e); return null; }
  }
  /** Guarda el estado del perfil activo. Devuelve {ok, error}. */
  function save(state) {
    try { localStorage.setItem(KEY[profile], JSON.stringify(state)); return { ok: true }; }
    catch (e) { return { ok: false, error: e && e.name === 'QuotaExceededError' ? 'No hay más espacio en el navegador. Exportá un respaldo y borrá datos viejos.' : 'No se pudo guardar en este navegador.' }; }
  }
  function clear(p) { localStorage.removeItem(KEY[p]); }
  function has(p) { return !!localStorage.getItem(KEY[p]); }
  function storageAvailable() {
    try { const k = '__mf_test'; localStorage.setItem(k, '1'); localStorage.removeItem(k); return true; } catch { return false; }
  }

  /** Normaliza y completa campos para versiones futuras del esquema. */
  function migrate(s) {
    const base = emptyState();
    s.schemaVersion = SCHEMA; // v1 → v2 no requiere cambios de datos
    for (const k of ['accounts', 'categories', 'txs', 'recurrings', 'loans', 'cards']) if (!Array.isArray(s[k])) s[k] = base[k];
    s.settings = Object.assign({}, base.settings, s.settings || {});
    s.settings.projection = Object.assign({}, base.settings.projection, s.settings.projection || {});
    for (const c of s.cards) c.statements = c.statements || [];
    for (const r of s.recurrings) { r.skipped = r.skipped || []; r.amounts = r.amounts || []; }
    return s;
  }

  /* ---------------- Validación de respaldos ---------------- */
  function validateBackup(obj) {
    const errors = [];
    if (!obj || typeof obj !== 'object') return { ok: false, errors: ['El archivo no es un respaldo válido.'] };
    if (obj.app !== 'mis-finanzas') errors.push('El archivo no fue generado por Mis Finanzas.');
    const d = obj.data;
    if (!d || typeof d !== 'object') errors.push('Falta el bloque de datos.');
    else {
      for (const k of ['accounts', 'categories', 'txs', 'recurrings', 'loans', 'cards']) if (!Array.isArray(d[k])) errors.push(`Falta la lista “${k}”.`);
      if (!errors.length) {
        const accIds = new Set(d.accounts.map((a) => a.id));
        const catIds = new Set(d.categories.map((c) => c.id));
        let bad = 0;
        for (const t of d.txs) {
          if (!Number.isInteger(t.amount) || t.amount <= 0 || !D.valid(t.date)) bad++;
          else if (t.accountId && !accIds.has(t.accountId)) bad++;
          else if ((t.kind === 'gasto' || t.kind === 'ingreso') && t.categoryId && !catIds.has(t.categoryId)) bad++;
        }
        if (bad) errors.push(`${bad} movimiento(s) tienen importes, fechas o referencias inválidas.`);
      }
      if (obj.schemaVersion > SCHEMA) errors.push('El respaldo es de una versión más nueva de la aplicación.');
    }
    return { ok: !errors.length, errors };
  }
  function makeBackup(state) {
    return { app: 'mis-finanzas', schemaVersion: SCHEMA, profile, exportedAt: new Date().toISOString(), data: state };
  }

  /* ---------------- CSV compatible con Excel (AR) ---------------- */
  const KIND_LABEL = { ingreso: 'Ingreso', gasto: 'Gasto', transferencia: 'Transferencia', pago_tarjeta: 'Pago de tarjeta', pago_prestamo: 'Pago de préstamo', prestamo_recibido: 'Préstamo recibido' };
  function toCSV(state, txs) {
    const acc = new Map(state.accounts.map((a) => [a.id, a.name]));
    const card = new Map(state.cards.map((c) => [c.id, c.name]));
    const cat = new Map(state.categories.map((c) => [c.id, c]));
    const grp = new Map(GROUPS.map((g) => [g.id, g.name]));
    const loan = new Map(state.loans.map((l) => [l.id, l.creditor]));
    const q = (v) => { const s = String(v ?? ''); return /[;"\n]/.test(s) ? '"' + s.replace(/"/g, '""') + '"' : s; };
    const head = ['Fecha', 'Tipo', 'Categoría', 'Grupo', 'Descripción', 'Medio de pago', 'Destino', 'Estado', 'Cuotas', 'Importe', 'Efecto en caja', 'Gasto económico'];
    const rows = txs.slice().sort((a, b) => a.date.localeCompare(b.date)).map((t) => {
      const c = cat.get(t.categoryId);
      const medio = t.cardId ? card.get(t.cardId) : acc.get(t.accountId);
      const dest = t.kind === 'transferencia' ? acc.get(t.toAccountId) : t.kind === 'pago_tarjeta' ? card.get(t.cardId) : t.kind === 'pago_prestamo' ? loan.get(t.loanId) : '';
      const cash = Engine.cashDeltas(t).reduce((s, [, d]) => s + d, 0);
      const econ = Engine.economicExpense(t);
      const [y, m, d] = t.date.split('-');
      return [`${d}/${m}/${y}`, KIND_LABEL[t.kind] || t.kind, c?.name || '', c ? grp.get(c.group) : '', t.description || '', medio || '', dest || '', t.status === 'pendiente' ? 'Pendiente' : 'Pagado', t.installments > 1 ? t.installments : '', Money.plain(t.kind === 'ingreso' || t.kind === 'prestamo_recibido' ? t.amount : -t.amount), Money.plain(cash), Money.plain(econ)].map(q).join(';');
    });
    return '﻿' + [head.join(';'), ...rows].join('\r\n');
  }

  /* ---------------- Datos de demostración (ficticios) ---------------- */
  /** Genera un set de datos ficticio relativo a la fecha de hoy. Determinístico. */
  function demoState(today = D.today()) {
    const s = emptyState();
    let seed = 7;
    const rnd = () => { seed = (seed * 16807) % 2147483647; return (seed - 1) / 2147483646; };
    const P = D.period(today);
    const p = (k) => D.addPeriod(P, k);
    const $ = (pesos) => pesos * 100;
    const id = uid;
    const tx = (o) => { s.txs.push({ id: id(), createdAt: Date.now(), status: 'pagado', installments: 1, ...o }); };

    s.accounts = [
      { id: 'acc-banco', name: 'Banco (caja de ahorro)', type: 'banco', openingBalance: $(90000), openingDate: D.periodStart(p(-2)), archived: false },
      { id: 'acc-billetera', name: 'Billetera virtual', type: 'billetera', openingBalance: $(62000), openingDate: D.periodStart(p(-2)), archived: false },
      { id: 'acc-efectivo', name: 'Efectivo', type: 'efectivo', openingBalance: $(28000), openingDate: D.periodStart(p(-2)), archived: false },
    ];
    s.cards = [
      { id: 'card-visa', name: 'Visa Banco', closingDay: 23, dueDay: 5, limit: $(2500000), statements: [], archived: false },
      { id: 'card-master', name: 'Mastercard Billetera', closingDay: 27, dueDay: 9, limit: $(1200000), statements: [], archived: false },
    ];
    const start = D.periodStart(p(-2));
    const rec = (o) => s.recurrings.push({ id: id(), active: true, skipped: [], materializeFrom: p(-2), estimated: false, accountId: 'acc-banco', cardId: null, frequency: 'mensual', startDate: start, ...o, amounts: [{ from: p(-2), amount: $(o.amount) }] });
    rec({ name: 'Sueldo', type: 'ingreso', categoryId: 'cat-sueldo', amount: 1780000, dueDay: 3 });
    rec({ name: 'Alquiler', type: 'gasto', categoryId: 'cat-alquiler', amount: 520000, dueDay: 10 });
    rec({ name: 'Expensas', type: 'gasto', categoryId: 'cat-expensas', amount: 96000, dueDay: 10, estimated: true });
    rec({ name: 'Internet y TV', type: 'gasto', categoryId: 'cat-internet', amount: 29500, dueDay: 15 });
    rec({ name: 'Gas', type: 'gasto', categoryId: 'cat-gas', amount: 21000, dueDay: 20, estimated: true });
    rec({ name: 'Electricidad', type: 'gasto', categoryId: 'cat-electricidad', amount: 46000, dueDay: 18, frequency: 'bimestral', estimated: true });
    rec({ name: 'Streaming', type: 'gasto', categoryId: 'cat-suscripciones', amount: 9900, dueDay: 6, accountId: null, cardId: 'card-visa' });
    rec({ name: 'Música', type: 'gasto', categoryId: 'cat-suscripciones', amount: 4300, dueDay: 12, accountId: null, cardId: 'card-master' });
    // Aguinaldo: junio y diciembre (semestral)
    const yr = Number(P.slice(0, 4));
    s.recurrings.push({ id: id(), name: 'Aguinaldo', type: 'ingreso', categoryId: 'cat-aguinaldo', accountId: 'acc-banco', cardId: null, frequency: 'semestral', startDate: `${yr}-06-18`, dueDay: 18, active: true, estimated: true, skipped: [], materializeFrom: P, amounts: [{ from: `${yr}-06`, amount: $(925000) }] });

    Engine.materializeRecurring(s, today, id);
    // pagar lo ya vencido, salvo el gas del mes actual (queda vencido para mostrar alertas)
    for (const t of s.txs) {
      if (t.status === 'pendiente' && t.date <= today) {
        if (t.recPeriod === P && t.description === 'Gas') continue;
        t.status = 'pagado'; t.paidDate = t.date;
      }
    }

    // Gastos variables y básicos de los últimos meses
    const daily = [
      ['cat-supermercado', 'Supermercado', [38000, 72000], 4, 'acc-banco'],
      ['cat-verduleria', 'Verdulería', [9000, 16000], 4, 'acc-efectivo'],
      ['cat-carniceria', 'Carnicería', [18000, 32000], 3, 'acc-billetera'],
      ['cat-farmacia', 'Farmacia', [8000, 25000], 1, 'acc-billetera'],
      ['cat-transporte-esencial', 'Carga SUBE', [10000, 10000], 2, 'acc-billetera'],
      ['cat-delivery', 'Delivery', [14000, 26000], 3, 'acc-billetera'],
      ['cat-cafe', 'Café', [3500, 6000], 6, 'acc-efectivo'],
      ['cat-kiosco', 'Kiosco', [2000, 5000], 4, 'acc-efectivo'],
      ['cat-salidas', 'Salida a cenar', [35000, 60000], 1, 'acc-banco'],
      ['cat-higiene', 'Perfumería', [9000, 18000], 1, 'acc-billetera'],
    ];
    for (let k = -2; k <= 0; k++) {
      const per = p(k);
      const lastDay = k === 0 ? D.parts(today).d : D.parts(D.periodEnd(per)).d;
      for (const [cat, desc, [lo, hi], times, acc] of daily) {
        const n = k === 0 ? Math.max(1, Math.round(times * lastDay / 30)) : times;
        for (let i = 0; i < n; i++) {
          const day = 1 + Math.floor(rnd() * lastDay);
          const amt = Math.round((lo + rnd() * (hi - lo)) / 100) * 100;
          tx({ kind: 'gasto', amount: $(amt), date: D.dayIn(per, day), categoryId: cat, description: desc, accountId: acc });
        }
      }
      // transferencia banco → billetera
      tx({ kind: 'transferencia', amount: $(200000), date: D.dayIn(per, Math.min(4, lastDay)), accountId: 'acc-banco', toAccountId: 'acc-billetera', description: 'Carga billetera' });
      tx({ kind: 'transferencia', amount: $(110000), date: D.dayIn(per, Math.min(5, lastDay)), accountId: 'acc-banco', toAccountId: 'acc-efectivo', description: 'Extracción cajero' });
    }
    // Compras con tarjeta
    const card = (o) => tx({ kind: 'gasto', accountId: null, ...o });
    card({ amount: $(960000), date: D.dayIn(p(-4), 14), categoryId: 'cat-compras', description: 'Heladera', cardId: 'card-visa', installments: 12 });
    card({ amount: $(186000), date: D.dayIn(p(-1), 8), categoryId: 'cat-compras-personales', description: 'Zapatillas', cardId: 'card-visa', installments: 3 });
    card({ amount: $(54000), date: D.dayIn(p(-1), 19), categoryId: 'cat-supermercado', description: 'Supermercado mayorista', cardId: 'card-visa' });
    card({ amount: $(61500), date: D.dayIn(p(-2), 21), categoryId: 'cat-supermercado', description: 'Supermercado mayorista', cardId: 'card-visa' });
    if (D.parts(today).d >= 2) card({ amount: $(420000), date: D.dayIn(P, 2), categoryId: 'cat-entretenimiento', description: 'Pasajes de vacaciones', cardId: 'card-master', installments: 6 });
    card({ amount: $(38000), date: D.dayIn(p(-1), 25), categoryId: 'cat-salidas', description: 'Recital', cardId: 'card-master' });
    card({ amount: $(72000), date: D.dayIn(P, Math.min(9, D.parts(today).d)), categoryId: 'cat-supermercado', description: 'Supermercado', cardId: 'card-visa' });

    // Préstamos
    s.loans = [
      { id: 'loan-banco', creditor: 'Banco del Plata', creditorType: 'banco', originalAmount: $(2400000), initialBalance: $(1720000), installments: 18, paidBefore: 6, installmentAmount: $(198000), frequency: 'mensual', nextDueDate: D.dayIn(p(-2), 12), rate: 72, accountId: 'acc-banco', categoryId: 'cat-prestamos-bancarios', notes: 'Préstamo personal a tasa fija (ficticio).', createdDate: D.periodStart(p(-2)), archived: false },
      { id: 'loan-empresa', creditor: 'Adelanto de la empresa', creditorType: 'empresa', originalAmount: $(600000), initialBalance: $(480000), installments: 10, paidBefore: 2, installmentAmount: $(60000), frequency: 'mensual', nextDueDate: D.dayIn(p(-2), 3), rate: 0, accountId: 'acc-banco', categoryId: 'cat-prestamos-de-la-empresa', notes: 'Sin interés.', createdDate: D.periodStart(p(-2)), archived: false },
      { id: 'loan-familia', creditor: 'Tía Marta', creditorType: 'familiar', originalAmount: $(300000), initialBalance: $(300000), installments: null, paidBefore: 0, installmentAmount: null, frequency: 'ninguna', nextDueDate: null, rate: 0, accountId: 'acc-efectivo', categoryId: 'cat-prestamos-familiares', notes: 'Devolver cuando se pueda.', createdDate: D.periodStart(p(-2)), archived: false },
    ];
    for (const loan of s.loans.slice(0, 2)) {
      for (let k = 0; k < 3; k++) {
        const ls = Engine.loanState(loan, s.txs, today);
        if (!ls.next || ls.next.date > today) break;
        const sug = Engine.suggestInterest(loan, ls.balance, loan.installmentAmount, ls);
        tx({ kind: 'pago_prestamo', loanId: loan.id, paymentType: 'cuota', amount: loan.installmentAmount, interest: sug.interest, date: ls.next.date, accountId: loan.accountId, categoryId: loan.categoryId, description: `Cuota ${loan.creditor}` });
      }
    }
    tx({ kind: 'pago_prestamo', loanId: 'loan-familia', paymentType: 'parcial', amount: $(50000), interest: 0, date: D.dayIn(p(-1), 20), accountId: 'acc-efectivo', categoryId: 'cat-prestamos-familiares', description: 'Devolución parcial Tía Marta' });

    // Pagos de resúmenes vencidos (Master del mes actual: pago parcial)
    for (const c of s.cards) {
      const cs = Engine.cardState(c, s.txs, today);
      for (const per of cs.periods) {
        if (per.closingDate >= today || per.outstanding <= 0 || per.dueDate > today) continue;
        const partial = c.id === 'card-master' && D.period(per.dueDate) === P;
        const amt = partial ? Math.round(per.outstanding * 0.6 / 100) * 100 : per.outstanding;
        tx({ kind: 'pago_tarjeta', cardId: c.id, amount: amt, date: D.addDays(per.dueDate, -1), accountId: 'acc-banco', description: `Pago resumen ${c.name}` });
      }
    }
    s.settings.projection.variableMonthly = Engine.suggestVariable(s, today);
    s.settings.projection.extras = [{ id: id(), period: p(1), dir: 'out', amount: $(650000), label: 'Arreglo del auto (supuesto)' }];
    s.settings.lastBackupAt = new Date().toISOString();
    return s;
  }

  return { SCHEMA, GROUPS, uid, emptyState, defaultCategories, readMeta, writeMeta, load, save, clear, has, storageAvailable, migrate, validateBackup, makeBackup, toCSV, demoState, KIND_LABEL, get profile() { return profile; } };
})();

</script>
<script>
/* =====================================================================
   MÓDULO: App (UI) — enrutamiento, vistas y acciones
   Depende de Engine (cálculos) y Store (persistencia).
   ===================================================================== */
const App = (() => {
  'use strict';
  const { Money, D } = Engine;
  const fmt = (c, o) => Money.format(c, o);

  /* ---------------- Estado de la sesión ---------------- */
  let state = null;           // datos del perfil activo
  let today = D.today();
  const ui = {
    route: 'inicio', movTab: 'lista', debtTab: 'tarjetas', projMonths: 6, openProj: null,
    filters: { period: D.period(D.today()), q: '', kind: '', cat: '', medio: '', status: '' },
  };
  const ROUTES = [
    { id: 'inicio', label: 'Inicio', icon: 'home' },
    { id: 'movimientos', label: 'Movimientos', icon: 'list' },
    { id: 'deudas', label: 'Deudas y tarjetas', short: 'Deudas', icon: 'card' },
    { id: 'proyeccion', label: 'Proyección', icon: 'chart' },
    { id: 'config', label: 'Configuración', short: 'Ajustes', icon: 'settings' },
  ];

  /* ---------------- Utilidades de render ---------------- */
  const $ = (s, r = document) => r.querySelector(s);
  const $$ = (s, r = document) => [...r.querySelectorAll(s)];
  const esc = (s) => String(s ?? '').replace(/[&<>"']/g, (c) => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
  const icon = (n, cls = 'i') => `<svg class="${cls}" aria-hidden="true"><use href="#i-${n}"/></svg>`;
  const amt = (c, { tone = false, sign = false, cls = '' } = {}) => {
    const t = tone ? (c < 0 ? ' neg' : c > 0 ? ' pos' : '') : '';
    return `<span class="amt${t}${cls ? ' ' + cls : ''}">${esc(fmt(c, { sign }))}</span>`;
  };
  const byId = (list, id) => list.find((x) => x.id === id);
  const cat = (id) => byId(state.categories, id);
  const acc = (id) => byId(state.accounts, id);
  const card = (id) => byId(state.cards, id);
  const loan = (id) => byId(state.loans, id);
  const groupName = (g) => Store.GROUPS.find((x) => x.id === g)?.name || g;
  const accIcon = (a) => (a?.type === 'banco' ? 'bank' : a?.type === 'billetera' ? 'wallet' : 'cash');
  const dl = (s, o) => Engine.dateLabel(s, o);
  const capital = (s) => s.charAt(0).toUpperCase() + s.slice(1);
  const WEEK = ['domingo', 'lunes', 'martes', 'miércoles', 'jueves', 'viernes', 'sábado'];
  const weekday = (s) => { const { y, m, d } = D.parts(s); return WEEK[new Date(y, m - 1, d).getDay()]; };
